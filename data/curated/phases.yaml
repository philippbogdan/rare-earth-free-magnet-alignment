# Curated phase descriptions for the account (docs/METHOD.md).
# Every physical magnitude is {ref: <record id>} into data/raw/*.yaml or data/curated/records.yaml,
# or {est: value, why: text} for an estimate made here (listed in FINDINGS.md). Plain values are
# crystallographic conventions only (Miller indices, Laue class, cell content).
# Selection rules, the same for every phase:
#   Js  - highest measured 300 K value on bulk/powder/ribbon material (films and DFT not used);
#   Tc  - measured on the same material as Js where available;
#   T_f - the published formation window of each path; parents' textures only where published.
#   single_variant particles: 'yes' only if demonstrated; otherwise 'unknown' (never assumed 'no').

