# Topic: mnbi -- SEALED OUTCOME records (measured remanence / Mr/Ms / texture of LTP-MnBi samples by route).
# Do not open before predictions are frozen (docs/METHOD.md section 5). Schema: data/SCHEMA.md (outcome record).
# Route codes: FP field-aligned powder; FS field solidification; DS directional solidification; FA field-assisted
# formation/annealing; EP films; isotropic = no-alignment reference; 'other: ...' for combinations.
# Qualitative results are recorded with unit 'other: qualitative ...' and a text value.

- id: mnbi_fp_adams1952
  phase: LTP-MnBi
  route: FP
  process: finely pulverized MnBi hot pressed in a strong magnetic field (Bell Labs 'new permanent magnet')
  conditions:
    field_T: not stated in abstract ('strong magnetic field')
    T_process_K: not stated (hot pressing)
    parent_texture: none (powder)
    magnet_axis: field direction
    density_rel: not stated
  quantity: Br
  value: 0.43
  unit: T
  uncertainty: null
  measured_along: alignment direction (implied)
  measurement: not stated in abstract; room temperature
  n_samples: best of several compacts ('some of these compacts')
  source:
    doi: 10.1063/1.1702032
    title: A New Permanent Magnet from Powdered Manganese Bismuthide
    first_author: Adams, Edmond
    year: 1952
    url: https://api.crossref.org/works/10.1063/1.1702032
    evidence: abstract
    locator: abstract
  quote: The new permanent magnet was prepared by hot pressing finely pulverized MnBi in the presence of a strong magnetic field to facilitate particle alignment. Some of these compacts showed a maximum energy product (BH)max as high as 4.3×106 gauss-oersteds, a coercive force (Hc) of 3400 oersteds and a residual flux density (Br) of 4300 gauss.
  note: Converted 4300 G = 0.43 T. Historical (Bismanol-type) field-pressed magnet; phase purity and density not given in abstract.
