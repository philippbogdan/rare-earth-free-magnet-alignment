    title: Synthesis, Characterization, and Microwave Absorption Properties of Reduced Graphene Oxide/Strontium Ferrite/Polyaniline
      Nanocomposites
    first_author: Luo
    year: 2016
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4788672/fullTextXML
    evidence: full_text
    locator: Results, Figure 6a paragraph
  quote: Figure 6a shows hysteresis loop of SrFe12O19 nanoparticles. SrFe12O19 magnetic nanoparticles are the permanent magnet
    and show the ferromagnetic, the hysteresis loop with high saturation magnetization (Ms) and the value is 67.15 emu g−1,
    which is close to the theoretical value of the saturation magnetization of M-type strontium ferrite (74.3 emu g−1). This
    fully shows that the preparation of SrFe12O19 nanoparticles are pure phase and no nonmagnetic impurity phase α-Fe2O3 exist
    in the product; it is consistent with the XRD analysis [26]. The coercivity (Hc) and remanence (Mr) of SrFe12O19 are 6022
    Oe and 39.09 emu · g−1, respectively. The squareness ratio (S) was calculated by the Stoner-Wohlfarth model, S = Mr/Ms
    = 0.58, the value of S is slightly higher than the previous work [42, 43], which means SrFe12O19 has more excellent magnetic
    properties. Figure 6b shows hysteresis loops of SrFe12O19 nanocomposites, and the magnetic parameters are shown in Table
    1. It can be observed that the saturation and remanent magnetization are dropped dramatically with an increase in the
    nonmagnetic R-GO and PANI and decreased with increase in the R-GO content of the composites; the coercivity of R-GO/SF/PANI
    nanocomposites declined slightly compared with pure SrFe12O19 magnetic nanoparticles; it also decreased with the increase
    in the R-GO content of the composites and gradually showed the magnetic characteristic of paramagnetic; the phenomenon
    is similar with a previous work [41].
  note: Only the pure rare-earth-free ferrite control is included; later polymer composites have no printed ratio.
