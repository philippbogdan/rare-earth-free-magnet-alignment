    locator: Results, Figure 5a paragraph
  quote: The magnetization curve of the SrFe12O19 measured at room temperature is shown in Figure 5a. The maximum applied
    field Hmax was 20 kOe to reach magnetic saturation (Ms). The sample exhibited a coercive field (Hc) equal to 6.1 kOe,
    remanent magnetization (Mr) = 33.15 emu/g, Ms = 62.8 emu/g, and remanent squareness (Mr/Ms) = 0.53. These magnetic attributes
    are typical of a hard magnetic material, confirming the high coercivity of the material. However, the curve exhibits discontinuities
    revealing minor irregularities.
