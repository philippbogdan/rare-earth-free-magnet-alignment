    locator: Results, SPS compact paragraph
  quote: The magnetic performance of the four SPS compacted pellets, plotted in Fig. 6b), varies remarkably from SPS_CSG.
    In case of SPS_CSG there is only a small variation in the Mr/Ms value compared to that of the starting CSG powder, the
    ratio increasing from 0.53 for the powder to 0.60 for the pellet. For the SPS_MSG pellets, the Mr/Ms value is increased
    by 20–27% with respect to the original powders, from 0.57 to 0.71–0.78, depending on the compacting temperature. This
    indicates that the crystallites become more aligned when compacted using the SPS press compared with the as prepared sample
    at room temperature. For all pellets, Hc decreases compared with the starting powder. SPS_CSG decreases by 12% to 427
    kA/m, resulting in the best Hc for the compacted pellets. The Hc of the SPS_MSG pellets drops by 13–17%, compared to the
    initial powders, resulting in 417 kA/m for SPS_MSG750 and 398 kA/m for SPS_MSG800. SPS_CSG has a BHmax of 10.8 kJ/m3,
    which is only 13% larger than the as-synthesised powder, whereas the maximum energy product is improved by >100% when
    the MSG synthesised powder is compacted to a pellet by SPS, leading to a BHmax of 22.0 kJ/m3. Furthermore, the crystallites
    made from MSG synthesis are more dense (97% of the theoretical density) compared to 92% density for CSG compacted powder.
  note: The passage gives only a range for the corresponding pellets, so no distinct pellet value is assigned.
