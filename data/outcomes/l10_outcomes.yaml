# Topic l10 - SEALED OUTCOME records (measured variant fractions, macroscopic uniaxial anisotropy,
# Mr/Ms, Br, texture) for L1_0 FeNi, FePt, CoPt, FePd made by field/stress ordering, epitaxy,
# powder/particle alignment, natural cooling (meteorites) or without alignment (isotropic).
# Do not open before predictions are frozen. Schema: data/SCHEMA.md (outcome record).
# Phase names as in data/raw/l10_inputs.yaml. Temperatures in K.
# Non-schema quantity used: `Ku_macro` (MJ/m3) = macroscopic uniaxial anisotropy of a multi-variant
# sample along the field/stress axis, a proxy for the degree of variant selection.
# Values read off figures carry locator "(read from plot)" and an uncertainty.
- id: feni_scfa_neel1964a
  phase: L10-FeNi
  route: SC+FA
  process: 'Fe50Ni50 single-crystal disk ordered by neutron irradiation at 295 °C with a magnetic field along [100] (literature: 2.5 kOe)'
  conditions:
    field_T: 0.25
    T_process_K: 568
    parent_texture: single crystal (disk, plane (011))
    magnet_axis: irradiation-field direction [100]
    density_rel: 1.0
  quantity: Ku_macro
  value: 0.32
  unit: MJ/m3
  measured_along: anisotropy energy in the (011) disk plane; uniaxial axis = field direction
  measurement: torque/anisotropy energy and magnetization curves, room temperature (fit K1 sin2θ + K2 sin4θ)
  n_samples: 1
  source:
    doi: 10.1063/1.1713516
    title: Magnetic Properties of an Iron—Nickel Single Crystal Ordered by Neutron Bombardment
    first_author: L. Néel
    year: 1964
    url: https://api.crossref.org/works/10.1063/1.1713516
    evidence: abstract
    locator: abstract
  quote: The study of the anisotropy energy in the sample plane [011], and the magnetization curves drawn for different directions, show that this sample presents the characteristics of a uniaxial substance. But if we express, in a classical way, the anisotropy energy by K1 sin2θ+K2 sin4θ, we find experimentally K1=3.2·106 ergs/cm3 and K2=2.3·106 ergs/cm3.
  note: 'Macroscopic K1 = 3.2×10^6 erg/cm3 = 0.32 MJ/m3 and K2 = 0.23 MJ/m3 of a multi-variant crystal (3 variants, ~150 Å crystallites); proxy for field-induced variant selection. Quantity ''Ku_macro'' is not in the schema list (proposed extension). Field value 0.25 T from Hlova 2024 (review). T_process 568 K < Tc(A1) ~723-773 K: parent ferromagnetic. Order parameter estimated 0.41-0.45 (Woodgate 2023 Table I).'
