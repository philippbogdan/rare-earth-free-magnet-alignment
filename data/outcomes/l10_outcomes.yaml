  quote: После отжига 660°С, 20 мин получено рекордное для эквиатомного сплава CoPt значение максимального энергетического произведения (BH)mах = 120 Тл • А/м при Hс = 480 кА/м и jr = 0,82 [13]. При этом анизотропия Hс и jr имеют вид, характерный для многоосных кристаллов, петли гистерезиса — ступенчатообразную форму, а величина jr превышает значения, вычисленные для ансамбля магнитоодноосных невзаимодействующих частиц с учетом их распределения по ориентациям ОЛН.
