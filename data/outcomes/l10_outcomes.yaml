  quote: Values for the coercive force, the residual magnetization, and the maximum energy product in the Fe– 40 mol %Pt magnet were 211 kA m−1, 1.0 T, and 93 kJ m−3, respectively. However, the magnetization of the Fe– 40 mol %Pt magnet was not saturated even in the external magnetic field of 2.4 MA mm−1.
