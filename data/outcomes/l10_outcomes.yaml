- id: feni_scfa_pauleve1968b
  phase: L10-FeNi
  route: SC+FA
  process: spherical Fe50Ni50 single crystals ordered by neutron irradiation at 295 °C, field along a fourfold vs a threefold axis
  conditions:
    field_T: null
    T_process_K: 568
    parent_texture: single crystal (sphere)
    magnet_axis: field direction
    density_rel: 1.0
  quantity: Ku_macro
  value: 'qualitative: field ∥ <100> -> tetragonal (uniaxial) bulk anisotropy; field ∥ <111> -> cubic bulk anisotropy with <111> easy'
  unit: ''
  measured_along: several directions
  measurement: magnetization curves and anisotropy energy
  n_samples: 2
  source:
    doi: 10.1063/1.1656361
    title: Magnetization Curves of Fe–Ni (50–50) Single Crystals Ordered by Neutron Irradiation with an Applied Magnetic Field
    first_author: J. Paulevé
    year: 1968
    url: https://api.crossref.org/works/10.1063/1.1656361
    evidence: abstract
    locator: abstract
  quote: When the magnetic field is applied along a fourfold axis, the bulk magnetic anisotropy is tetragonal with a very large value for K3. When the magnetic field is applied along a three fold axis, the bulk magnetic anisotropy is cubic and the threefold axis becomes an easy axis of magnetization; the magnetization measured along the easy direction reaches saturation with a certain law of approach, while the magnetization measured along the [100] direction reaches saturation immediately.
  note: 'Qualitative test of the variant-selection geometry: with the field along <111> all three <100> variants are equally favoured.'
