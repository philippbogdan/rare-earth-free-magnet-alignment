    locator: Ch. 3, Table 3.1
  quote: 'Table 3.1: Data of 5 MgO/Cr(10.2 nm)/Fe16 N2 (26.7)/Cr(10.2) samples used in this study. The samples were annealed at 160 ◦ C. Hswitch is the switching field in the out-of-plane loop, ∆switch is the amplitude of the switch, shown as a fraction of Ms (see text). Sample 1 2 3 4 5 Annealing time (h) 6 10.75 12 15 36.25 Order parameter 0.66 0.75 0.62 0.72 0.66 Hswitch (kOe) 4.7 4.3 5.2 3.7 5.2 ∆switch 2Ms 0.026 0.039 0.019 0.037 0.020'
  note: 'Values per sample 1-5: 0.026, 0.039, 0.019, 0.037, 0.020 (order parameters 0.62-0.75); text: ''The out-of-plane loop clearly has a nonzero remanence'', conclusions: switching magnitude 2-4% of the total moment. The author concludes that (001) Fe16N2 films have an in-plane easy axis set by shape anisotropy and no effective PMA; the perpendicular component (2-4% of the moment) is attributed to isolated V-shaped grains / interface (ch. 5). So the c-axis remanence of a continuous c-normal film is shape-limited, not texture-limited.'
