- id: ndfeb_truong2016_mrms_8
  phase: Nd2Fe14B
  route: DS+FA
  process: field-assisted melt-spun Nd10.5Fe72Co11B6.5 ribbon
  conditions:
    field_T: 0.32
    wheel_speed_m_s: 8
    field_direction: normal to wheel surface
  quantity: Mr_over_Ms
  value: 0.66
  unit: dimensionless
  measured_along: along ribbon measuring direction, not stated relative to field
  measurement: Mr divided by magnetization measured at 30 kOe (3 T); this may be below true saturation
  n_samples: 1
  source:
    doi: 10.15625/0868-3166/26/1/7686
    title: Magnetic field assisted melt–spinning Nd-Fe-B ribbons and anisotropic bonded NdFeB magnets prepared thereof
    first_author: Nguyen Xuan Truong
    year: 2016
    url: https://vjs.ac.vn/index.php/cip/article/download/7686/pdf/31785
    evidence: full_text
    locator: p. 61, paragraph below Fig. 1
  quote: 'The mentioned texture of the prepared FAMS Nd10.5 Fe72 Co11 B6.5 ribbons is approved by

    the high ratio α between the remanent magnetization Mr {M(H = 0)} and the magnetization Ms

    measured at H = 30 kOe (see Fig. 2). For the ribbons melt-spun at v = 8, 10, 12, 14 and 16 m/s,

    the factor α is 0.66, 0.69, 0.73, 0.68 and 0.70, respectively. All these values are higher than the

    value of 0.5 typical for the isotropic ribbons.'
  note: Co-bearing nanocomposite ribbon. Values listed in wheel-speed order. Ratio can include exchange enhancement and is
    not directly A.
