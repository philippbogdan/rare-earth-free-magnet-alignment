    hard_phase_wt_fraction: 0.3
  quantity: Br
  value: 0.38
  unit: T
  measured_along: parallel to c-axis / static field
  measurement: VSM hysteresis loop; max magnetizing field not stated in accessible text
  n_samples: 1
  source:
    doi: 10.1038/s41598-019-42053-9
    title: Crystalline orientation control of the platelet Nd2Fe14B phase to produce magnetic anisotropy via electromagnetic
      vibration processing
    first_author: Mingjun Li
    year: 2019
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6450867/fullTextXML
    evidence: full_text
    locator: Magnetic properties, Fig. 4b
  quote: In contrast, the saturation remanence and coercivity acquired along the c axis of the magnetic platelets are 0.38
    T and 0.78 T, respectively, whereas they are almost naught when measured perpendicular to the c axis in the alloy that
    was solidified by two-step EMV processing, as revealed in Fig. 4b, indicating that the present two-step EMV solidification
    technique is effective in producing a bulk magnet with strong anisotropy in magnetism.
  note: Reported as saturation remanence for the composite; the hard phase is only 30 wt%.
