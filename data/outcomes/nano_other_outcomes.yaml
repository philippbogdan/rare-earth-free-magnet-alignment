    title: Magnetic and structural properties of ferromagnetic Fe5PB2 and Fe5SiB2 and effects of Co and Mn substitutions
    first_author: McGuire
    year: 2015
    url: https://arxiv.org/pdf/1509.02544
    evidence: full_text
    locator: Section III.A (Fig. 2a)
  quote: For each material, the intensity of the 004 reflection is strongly increased relative to the 022 and 121 reflections when the powders are magnetically aligned. This indicates that the easy axis of magnetization is parallel to the c* reciprocal lattice vector. For tetragonal symmetry, this is the c-axis of the crystal structure. Some intensity is still observed on the 022 and 121 reflections of the aligned samples, which is expected if the alignment is incomplete or if all of the powder particles are not single crystals, but instead are composed of agglomerates of misaligned crystallites.
  note: No numeric texture factor given.
