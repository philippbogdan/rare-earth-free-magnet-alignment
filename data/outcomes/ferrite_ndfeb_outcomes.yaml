  quote: Over-quenched melt-spun ribbons of nominal composition Nd0.14(Fe0.91B0.09)0.86can be compacted to fully dense permanent magnets by hot-pressing at 700-750°C to 100 kPa (-15 kpsi). The resulting
    material is only slightly magnetically aligned with room temperature magnetics:B_{r}/H_{ci}\simeq 8kG/19 kOe. Die-upsetting to a thickness reduction of 50% producesB_{r}/H_{ci}\simeq 11kG/12 kOe and
    is accompanied by a lateral plastic flow of the ribbons and a corresponding ribbon thickness reduction.
  note: Abstract has LaTeX residue ('B_{r}/H_{ci}\simeq'); 8 kG = 0.8 T, 11 kG = 1.1 T. 'to 100 kPa' is as printed (likely 100 MPa ~ 15 kpsi). Measurement direction not stated; for the die-upset magnet
    the easy axis is the press direction.
