    (closed, abstract not available). Conditions from review text ("903 K anneal for 3 min while the specimen was
    under uniaxial compression") and Table 7 ("903 K anneal for 3 min under 320 MPa uniaxial compression"). Keller
    et al. 2023 (JMMM 587, 171331, intro) gives the same: single tau variant with [001] parallel to the uniaxial
