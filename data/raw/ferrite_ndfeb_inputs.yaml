- id: srm_easy_axis_granados2021
  phase: SrFe12O19
  quantity: easy_axis
  value: c axis [001] (normal to the platelet plane)
  unit: ''
  conditions: M-type hexaferrites (BaM and SrM), room temperature
  source:
    doi: 10.1088/1361-6463/abfad4
    title: On the potential of hard ferrite ceramics for permanent magnet technology—a review on sintering strategies
    first_author: Granados-Miralles, Cecilia
    year: 2021
    url: https://arxiv.org/pdf/2309.15680
    evidence: review
    locator: Section 1, p. 2
  quote: This shape favors a crystallographic alignment during compaction under a uniaxial pressure, during which the plate-like particles will have a tendency to spontaneously lay on their larger surface
    side, just as a deck of cards would. This shape-induced orientation implicitly entails a magnetic alignment, as the easy magnetization axis lies parallel to the c-axis (perpendicular to the platelet
    plane) [52, 58], vanishing the need for an external magnetic field applied prior or during compaction, which considerably simplifies manufacturing the magnetic piece.
  note: ''
- id: srm_growth_direction_granados2021
  phase: SrFe12O19
  quantity: growth_direction
  value: 'platelet habit: fast growth in the basal plane, platelet plane perpendicular to c'
  unit: ''
  conditions: M-type hexaferrite particles (BaM and SrM) from powder synthesis
  source:
    doi: 10.1088/1361-6463/abfad4
    title: On the potential of hard ferrite ceramics for permanent magnet technology—a review on sintering strategies
    first_author: Granados-Miralles, Cecilia
    year: 2021
    url: https://arxiv.org/pdf/2309.15680
    evidence: review
    locator: Section 1, p. 2
  quote: The last one is particularly interesting here, as the particles of the M-type hexaferrites have a tendency to acquire a platelike shape, with the platelet plane perpendicular to the c-axis (see
    figure 2) [58, 59].
  note: Habit (crystal shape) rather than solidification growth; relevant to shape-driven alignment.
