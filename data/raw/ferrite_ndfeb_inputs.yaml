    evidence: review
    locator: Sect. 2.1
  quote: In typical HDDR treatment, Nd2Fe14B powder prepared by hydrogen decrepitation is used as a starting material and is then decomposed into NdH2, Fe, and Fe2B by heat treatment in hydrogen. During
    subsequent heat treatment in a vacuum, the hydrogen is removed from NdH2, and the finely disproportionated Nd, Fe, and Fe2B recombine into fine Nd2Fe14B grains. Compared with melt-spinning, the HDDR
    process offers the advantage of producing anisotropic powders in which the c -axes of the Nd2Fe14B grains can be aligned in one direction by adding additional elements or by controlling the hydrogen
    pressure and temperature during the HDDR process.
  note: ''
