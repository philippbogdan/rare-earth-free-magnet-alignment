    evidence: abstract
    locator: abstract (CaltechAUTHORS metadata record)
  quote: The objective of this paper is to describe a method of producing textured barium hexaferrite by magnetic field assisted gelcasting while avoiding the limited solids loading caused by stacking of
    barium hexaferrite plates. We illustrate here a method of gelcasting a matrix of non-magnetic iron (III) oxide and barium carbonate in the presence of barium ferrite seeds for templated grain growth.
    At high temperatures, the iron oxide and barium carbonate react to form a fine-grained barium ferrite matrix surrounding the previously aligned barium ferrite seeds.
  note: Templates (seeds) are aligned by the field at room temperature (ferrimagnetic, free to rotate); the matrix phase forms above Tc and acquires texture only by growth on/consumption by the templates.
