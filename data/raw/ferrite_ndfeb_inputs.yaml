    evidence: abstract
    locator: abstract
  quote: Upon sintering, the large, better oriented crystallites grow, at the expense of the smaller ones whose orientation is not as good. The changes this involves in the crystal texture were determined
    quantitatively. The crystallites are arranged in the form of a simple, normal fibre-texture, with the c axis as the fibre axis and with the lattice in random azimuthal position around the c axis. ...
    From the texture, the remanence and its angular dependence can be calculated on the assumption that, upon de-energizing of the saturating field, the vectors of magnetization in the individual crystallites
    swing back into the nearest c axis and there is no interaction between neighboring crystallites. Densely sintered specimens showed good agreement between theory and experiment.
