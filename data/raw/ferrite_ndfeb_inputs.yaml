# Inputs for topic ferrite_ndfeb (see docs/METHOD.md, data/SCHEMA.md).
# Phase names used: SrFe12O19 (SrM), BaFe12O19 (BaM), (Sr,La)(Fe,Co)12O19 (La-Co substituted SrM; La is a rare earth),
#   (Ca,La)(Fe,Co)12O19 (Ca-La-Co M-type; contains La), Nd2Fe14B (reference phase of today's sintered magnets).
# Records stated for 'M-type hexaferrites' in general are filed under SrFe12O19 (conditions say so).
# Compiled 2026-10-03 by the literature agent for topic ferrite_ndfeb (M-type hexaferrites; sintered Nd2Fe14B as reference).
# Every record carries a verbatim quote from a fetched page/PDF; quotes were machine-checked against the saved text of the
# source (scratch copies in .tmp/fn_work/src, not committed). OCR sources (scanned Philips Technical Review 1951/52 and 1954,
# J-STAGE scans) are marked in `note`; OCR character errors were corrected to the printed text.
# Conventions: unit conversions (G, kG, Wb/m2, erg/cm3, degC -> SI/K) are done by the compiler and stated in `note`;
# datasheet ranges -> value = midpoint (or typical/nominal if given), uncertainty = half-range; values read from figures say
# 'read from plot' in the locator. Datasheet/web records without a printed year omit `year` (accessed 2026-10-03).
# Philips Technical Review articles have no DOI (doi: null, stated in note).

