    year: 2021
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC7850326/fullTextXML
    evidence: full_text
    locator: Sect. 2.1-2.2
  quote: Then, the powder was cold-pressed at room temperature followed by hot-pressing at approximately 800°C to obtain a fully dense body. A hot-pressed body is an isotropic magnet with grains that are
    approximately 20–50 nm. Finally, to obtain anisotropic magnets, a hot-pressed body was hot-deformed at approximately 800°C; this is the point at which thermo-mechanical alignment of the crystal grains
    occurs. ... In Figure 3(a–d) , the grains align gradually in the same direction as the compression direction, as R became larger. The grain size and its aspect ratio simultaneously became larger, whilst
    no dislocations or slip lines were observed in normal area [ 13 ]. ... Therefore, we inferred possible mechanism as follows. First, the grain boundary phase melts and anisotropic grain growth occurs
    during hot pressing. Then, the anisotropic grain growth and crystal rotation with the grain boundary sliding of the c-plane (broad surface of platelet-shaped grain) are promoted by a stress under hot
    deforming [ 17 ]. Here, the liquid grain boundary phase acts as a lubricant and a path for the transfer of atoms which promotes the anisotropic grain growth under a compression stress. Finally, the
    c -axis of platelet grains align parallel to the press direction.
  note: Sect. 2.1 of the same review also contains the sentence 'the direction of the c-axis (easy axis) is perpendicular to the compression direction', which contradicts Sect. 2.2 and Mishra 1987 (c parallel
    to stress axis); Sect. 2.2 is taken. Mechanism stated by the authors as not fully understood (grain boundary migration, interface-controlled solution-precipitation creep also proposed).
