# Topic: mn4n. Inputs are intrinsic properties and formation mechanisms only.
# Gaps: numerical/sign-specific bulk cubic K1; decomposition T_stab and atmosphere/time window;
# measured density at 300 K; bulk nitriding and alloy transformation OR and variant count;
# isolated single-crystal particle habit relative to <111>; melt crystallisation and growth direction;
# hot deformation mechanism; film rocking-curve FWHM; field-aligned powder or textured-bulk data.
- id: mn4n_structure_zhou2021
  phase: Mn4N
  quantity: structure
  value: cubic antiperovskite ferrimagnet, Mn on corner and face-center sites, N at body center
  unit: ''
  conditions: stoichiometric Mn4N
  source:
    doi: 10.1063/5.0032167
    title: Rare-earth-free ferrimagnetic Mn4N sub-20 nm thin films as potential high-temperature spintronic material
    first_author: Zhou
    year: 2021
    url: https://arxiv.org/pdf/2012.10493
    evidence: full_text
    locator: Introduction
  quote: 'Anti-perovskite Mn4N has been known as a crystalline, rare-earth-free ferrimagnetic material. In


