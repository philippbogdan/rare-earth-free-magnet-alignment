- id: hcpco_k1t_aitatmane2013
  phase: hcp-Co
  quantity: other
  value: 'K1(T) of bulk hcp Co: ~constant 0-200 K, then linear decrease from about +0.66 MJ/m3 (200 K) to about -0.12 MJ/m3 (600 K); negative above ~500 K (easy direction leaves the c axis)'
  unit: MJ/m3
  conditions: bulk hcp Co, literature values compiled by the authors (refs 22-24)
  source:
    doi: 10.1016/j.jssc.2012.08.009
    title: High temperature structural and magnetic properties of cobalt nanorods
    first_author: Ait Atmane
    year: 2013
    url: https://hal.science/hal-00916597/document
    evidence: review
    locator: Section 3.4.1
  quote: As shown in Figure 8, the magneto-crystalline anisotropy constant KMC of bulk hcp Co is almost temperature independent from 0 to 200 K and linearly decreases from KMC ≈ 6.6×105J.m-3 at 200 K down to KMC ≈ -1.2×105J.m-3 at 600 K [22-24]. [...] Note that, above 500 K, the value of the magnetocrystalline constant becomes negative which means that it counteracts the shape anisotropy of the wire.
  note: 'Symbol-font glyphs restored (≈, ×, minus); ''105'' = 10^5. Relevant to any field/thermal step above ~500 K: magnetocrystalline easy axis no longer along c.'
- id: hcpco_shape_anagnostopoulou2016
  phase: hcp-Co
  quantity: other
  value: 'shape_anisotropy: for c parallel to the wire axis, mu0Ms/2 = 0.89 T (shape) + 0.58 T (magnetocrystalline) = 1.47 T Stoner-Wohlfarth switching field'
  unit: T
  conditions: infinitely long hcp-Co cylinder, c axis along the wire, room temperature, Stoner-Wohlfarth estimate
  source:
    doi: 10.1039/c5nr07143g
    title: Dense arrays of cobalt nanorods as rare-earth free permanent magnets
    first_author: Anagnostopoulou
    year: 2016
    url: https://insa-toulouse.hal.science/hal-02017936/document
    evidence: full_text
    locator: Introduction
  quote: For cobalt wires with the hcp structure and the c axis parallel to the wire long axis a theoretical coercivity µ 0Hc = µ 0MS/2 + K1/2MS = 0.89 + 0.58 = 1.47 T is expected provided that the Stoner-Wohlfarth model applies.
  note: Shape and magnetocrystalline easy axes coincide (both along the rod axis). The printed term 'K1/2MS' evaluates to 0.58 T only if read as 2K1/MS with K1 ~0.41 MJ/m3 (typo in the paper).
- id: hcpco_shape_gandha2014
  phase: hcp-Co
  quantity: other
  value: 'shape_anisotropy: maximum shape-anisotropy field 9 kOe (0.9 T) plus magnetocrystalline 7.6 kOe (0.76 T) = 16.6 kOe (1.66 T) total anisotropy field for c along the wire'
  unit: kOe
  conditions: infinitely long Co ellipsoid with [0001] along the long axis, room temperature
  source:
    doi: 10.1038/srep05345
    title: High Energy Product Developed from Cobalt Nanowires
    first_author: Gandha
    year: 2014
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4061547/fullTextXML
    evidence: full_text
    locator: Results, after Eq. (1)
  quote: If the long-axis direction of a Co nanowire conforms to its magnetocrystalline uniaxial direction [0001] (c-axis, or normal direction of the (002) planes), as observed in Fig. 1, the maximum magnetic anisotropy field contributed from the shape anisotropy will be 9 kOe. Plus the anisotropy field of 7.6 kOe contributed by the magnetocrystalline anisotropy of bulk cobalt19, a total anisotropy field up to 16.6 kOe at room temperature may be reached, which shows the upper limit of coercivity that can be developed from Co nanocrystals with high aspect ratio.
  note: ''
