# nano_other inputs: rare-earth-free hard magnets based on nanostructure or less common phases
# (collected 2026-10-03 for the magnet-align-frontier project; schema: data/SCHEMA.md)
#
# Phase names used in `phase:` (header of this topic file):
#   hcp-Co          hcp cobalt nanorods / nanowires (polyol, solvothermal, organometallic, epitaxial); easy axis c along the rod
#   hcp-CoNi        Co-rich hcp Co-Ni (Co80Ni20) nanowires
#   FeCo-elongated  bcc Fe or Fe-Co elongated single-domain particles: ESD / Lodex magnets, Fe-Co nanowires (shape anisotropy only)
#   Co2C, Co3C      orthorhombic cobalt carbides (polyol nanoparticles; Co2C also by carburising hcp-Co rods)
#   epsilon-Fe2O3   orthorhombic (Pna21) epsilon iron oxide, incl. Rh/Ga/Al/Cr-substituted (composition in `conditions`)
#   bct-FeCo        tetragonally distorted Fe-Co: epitaxially strained films, interstitially strained Fe-Co-C/B/N(-V), templated nanostructures
#   Fe5SiB2, Fe5PB2, (Fe,Co)5PB2   tetragonal Cr5B3-type borides
#   Fe3Sn           hexagonal Ni3Sn-type (easy-plane)
#   Fe2P-based      hexagonal Fe2P and (Fe,Co)2(P,Si)
#   Mn4N            cubic anti-perovskite ferrimagnet;  MnN  only a predicted (hypothetical) high-MAE structure
#
# Conventions:
# * quantity `other`: `value` starts with a tag - alignment_method:, consolidation:, shape_anisotropy:, candidate_status:,
#   anisotropy_type:, reversal:, assembly mechanics, size window, morphology, K1(T).
# * evidence `review` = value quoted by the source from elsewhere (incl. bulk constants adopted by a research paper; full
#   text read) or a review/thesis statement; `abstract` = only the abstract was accessible.
# * Quotes are verbatim from the stored source text (PDF text layer, PMC XML or abstract). Superscripts flattened by the
#   PDF text layer are kept as extracted and explained in `note` (e.g. '105' = 10^5). '[...]' marks omitted text
#   (including page numbers interleaved by the text layer). Symbol-font glyphs (≈, ×, −, ε) are written as the symbol.
# * Quotes typed from rendered page images because the text layer garbles symbols (AIP/APS '=' -> '¼' etc.):
#   hcpco_k1_camara2016_bulk, hcpco_k1_camara2016_nw, efe2o3_tc_gareev2023, efe2o3_ms_mass_gareev2023, bctfeco_k1_andersson2006_40k, bctfeco_k1_andersson2006_300k, bctfeco_js_andersson2006, bctfeco_tetragonality_andersson2006
# * Sources without a Crossref DOI (doi: null): Chan 2018 UCSD PhD thesis (eScholarship), Yang 2023 arXiv preprint.
#   The Anagnostopoulou thesis DOI (10.70675/...) has no Crossref 'issued' date; year 2016 = Crossref 'approved' date.
# * Unit conversions done here are stated in `note`; values read off figures carry 'read from plot' in the locator.
