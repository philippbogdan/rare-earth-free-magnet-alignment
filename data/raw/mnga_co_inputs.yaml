# mnga_co inputs (visible). Topic: Mn-Ga hard phases and Co-rich rare-earth-free compounds.
# Phases (names used in `phase`):
#   L10-MnGa    L1_0 (AuCu-type, P4/mmm) Mn_xGa, x ~ 1-1.8 (Mn2Ga(r) / Mn3Ga2 in the Mn-Ga diagram)
#   D022-Mn3Ga  D0_22 (Al3Ti-type, I4/mmm) Mn3-xGa, 0 <= x <= 1 (Mn3Ga ... Mn2Ga); composition in `conditions`
#   D022-Mn3Ge  D0_22 tetragonal Mn3Ge (bulk metastable; parent hexagonal D0_19)
#   Zr2Co11     hard Zr2Co11 phase (rhombohedral R32 polymorph carries the anisotropy), incl. Zr-Co-B, Zr-Co-Mo(-Si) alloys
#   HfCo7       hard Hf-Co phase 'HfCo7' (orthorhombic; incl. Hf2Co11, Hf2Co11B, Co-Hf-B, Co-Hf-Zr-B alloys)
# Conventions: temperatures in K (converted from C where needed, see note); Js = mu0*Ms in T (converted from
# emu/cm3, kA/m or 4*pi*Ms in kG where needed, formula in note); K1 in MJ/m3 (1 Merg/cm3 = 0.1 MJ/m3);
# lattice values in Angstrom as {a, b, c}. Quotes are verbatim; '...' joins verbatim fragments of the same source.
# Values quoted from reviews carry evidence: review. Outcome data (remanence, Mr/Ms, texture) are NOT in this file.
