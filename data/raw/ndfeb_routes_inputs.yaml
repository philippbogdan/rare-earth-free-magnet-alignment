    evidence: full_text
    locator: p. 2, Introduction
  quote: 'The current work explores the effect of high field thermomagnetic processing on the

    microstructural evolution and magnetic behavior of Nd2 Fe14 B ribbons produced through

    melt-spinning with TiC additions. A custom-built differential scanning calorimeter (DSC) was used to

    determine the crystallization temperatures at zero-field and applied fields of 20 kOe and 90 kOe, which

    guided subsequent heat treatments to evaluate phase evolution. X-ray diffraction (XRD) was used for

    phase identification and transmission electron microscopy (TEM) was employed for observation of

    the microstructural size, morphology, and magnetic domain structure. A superconducting quantum

    interference device (SQUID) and vibrating sample magnetometer (VSM) were used to measure the

    magnetic behavior.'
