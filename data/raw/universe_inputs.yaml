- id: uni_phys_dchi_alignment_criterion_sugiyama2003
  phase: all
  quantity: other
  value: 'crystal alignment of non-ferromagnetic crystals by susceptibility anisotropy: the field torque rotates
    a crystal to the orientation of lowest magnetization energy; alignment works only if V·Δχ·B²/(2μ0) > kT (Eq.
    22); needs crystal magnetic anisotropy and low viscosity (liquid or semi-solid)'
  unit: ''
  conditions: para-/diamagnetic crystals free to rotate (melt, semi-solid, reheated film), field B up to 12 T, volume
    susceptibility anisotropy Δχ, crystal volume V; for Zn in their conditions the criterion gives radius > 20 nm
  source:
    doi: 10.2355/isijinternational.43.855
    title: The Control of Crystal Orientation in Non-magnetic Metals by Imposition of a High Magnetic Field
    first_author: Sugiyama, T.
    year: 2003
    url: https://www.jstage.jst.go.jp/article/isijinternational1989/43/6/43_6_855/_pdf
    evidence: full_text
    locator: abstract; Sect. 2.1 (Eq. 1); Eq. (22)
  quote: Up to now, the possibility of magnetic orientation by imposition of the high magnetic field has been studied,
    it was said that existence of crystal magnetic anisotropy and a low viscosity are essential. ... The principle
    of crystal orientation using a magnetic field is that a torque rotates a crystal to take a stable crystal orientation
    so as to decrease the magnetization energy. ... The magnetic orientation works only when the magnetization energy
    is larger than a thermal energy kT.14) This condition can be described as Eq. (22) ... where k is Boltzmann
    constant. The condition that a particle radius should be larger than 20 nm is derived from Eq. (22) by using
    physical properties and experimental conditions adopted in this experiment.
  note: Group of S. Asai (Nagoya). Eq. (22) is garbled in text extraction (V, Δχ, B², 2μ0 and kT legible; relation
    sign lost); the text states the condition 'magnetization energy larger than kT'. The authors also bound the
    radius from above (about 100 μm for a 1 s rotation time, Zn) by the equation of motion with viscous drag. For
    a ferromagnetic forming phase the same torque argument applies with the magnetocrystalline anisotropy energy
    instead of Δχ B²/2μ0.
- id: uni_phys_asai2003_review_field_orientation
  phase: all
  quantity: other
  value: 'review: the magnetization force/energy acts on non-magnetic (para- and diamagnetic) materials in high
    fields, and crystal orientation by a high field has been obtained in electrodeposition, vapour deposition, solidification,
    baking (sintering), slip casting and precipitation'
  unit: ''
  conditions: superconducting-magnet fields (order 10 T), non-ferromagnetic materials
  source:
    doi: 10.1016/j.stam.2003.07.001
    title: Crystal orientation of non-magnetic materials by imposition of a high magnetic field
    first_author: Asai, S.
    year: 2003
    url: https://api.openalex.org/works/doi:10.1016/j.stam.2003.07.001
    evidence: abstract
    locator: abstract
  quote: On the other hand the magnetization force that is familiar with the force to attract iron to a magnet,
    has been recognized to be effective even in non-magnetic materials when those are placed under a high magnetic
    field, which has become rather conveniently available by developing superconducting technologies in these days.
    In this paper, main results obtained when the imposition of a high magnetic field was accompanied to several
    materials processing such as electrodeposition, vaperdeposition, solidification, baking, slip-casting and precipitation,
    arereviewed from the view point of crystal orientation of non-magnetic materials.
  note: Asai, Sassa, Tahashi, Sci. Technol. Adv. Mater. 4 (2003) 455-460 (open access, but the publisher site refused
    scripted download); abstract reconstructed from the OpenAlex inverted index, so word joins such as 'vaperdeposition',
    'arereviewed' are as fetched. The quantitative criterion is in uni_phys_dchi_alignment_criterion_sugiyama2003
    (same group).
- id: uni_phys_cahn1963_magnetic_aging_spinodal
  phase: all
  quantity: other
  value: field during spinodal decomposition forms uniformly spaced rods parallel to the magnetization; most effective
    when aging just below the intersection of the Curie temperature with the spinodal temperature, which limits
    effective magnetic-aging alloys to compositions near that intersection
  unit: ''
  conditions: spinodally decomposing ferromagnetic alloy aged in a uniform field (AlNiCo / Fe-Cr-Co type)
  source:
    doi: 10.1063/1.1729261
    title: Magnetic Aging of Spinodal Alloys
    first_author: Cahn, J.W.
    year: 1963
    url: https://api.crossref.org/works/10.1063/1.1729261
    evidence: abstract
    locator: abstract
  quote: The effect of a uniform magnetic field on the mechanism, kinetics, and resulting morphology of a spinodally
    decomposing alloy is investigated. It is shown that the magnetic field is most effective in forming uniformly
    spaced rods parallel to the magnetization if the aging is carried out just below the intersection (on the phase
    diagram) of the Curie temperature and the temperature where the spinodal instability sets in. This condition
    limits the effective magnetic aging alloys to the composition range near this intersection.
  note: J. Appl. Phys. 34 (1963) 3581-3586; abstract from the Crossref record (identical in OpenAlex); full text
    not accessible.
- id: uni_phys_neel1954_field_directional_order
  phase: all
  quantity: other
  value: 'directional (pair) ordering: in a ferromagnetic solid solution of at least two components heat-treated
    in a field, nearest neighbours of each atom distribute anisotropically (orientation superstructure); retained
    by quenching, it gives a uniaxial induced anisotropy; role suggested in alnico V and oriented Co ferrites'
  unit: ''
  conditions: ferromagnetic solid solution annealed hot in a field and quenched; magnitude calculated for simple
    cubic lattices and for isotropic-by-compensation substances
  source:
    doi: 10.1051/jphysrad:01954001504022500
    title: Anisotropie magnétique superficielle et surstructures d'orientation
    first_author: Néel, L.
    year: 1954
    url: https://api.archives-ouvertes.fr/search/?q=halId_s:jpa-00234899&fl=abstract_s
    evidence: abstract
    locator: abstract (part 2)
  quote: Dans la seconde partie, on montre, en adoptant le point de vue précédent, que dans les solutions solides
    ferromagnétiques à deux constituants au moins, traitées à chaud dans un champ magnétique, les atomes proches
    voisins d'un atome donné doivent se répartir d'une façon anisotrope autour de ce dernier et donner naissance
    à une surstructure d'orientation. Par trempe, cette surstructure est susceptible de se conserver en faux équilibre
    à basse température et se manifeste par l'apparition d'une anisotropie magnétique de caractère uniaxial. ...
    On suggère le rôle possible de ces effets dans l'alnico V et les ferrites de cobalt orientés.
  note: 'J. Phys. Radium 15 (1954) 225-239 (HAL jpa-00234899); abstract in French from the HAL API (full-text PDF
    behind a bot check). Paraphrase: atomic pair (directional) order set up by annealing in a field is frozen in
    by quenching and gives a uniaxial anisotropy along the annealing-field direction.'
