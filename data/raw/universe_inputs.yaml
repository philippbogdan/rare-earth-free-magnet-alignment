- id: uni_phys_chikazumi1955_induced_anisotropy
  phase: all
  quantity: other
  value: anisotropy induced by magnetic annealing (Fe-Ni) is explained by dipole-dipole interaction in a directionally
    ordered arrangement of atoms, not by magnetostrictive strain of directional order nor by an elongated ordered
    phase
  unit: ''
  conditions: Fe-Ni alloys annealed in a magnetic field; composition dependence measured
  source:
    doi: 10.1143/jpsj.10.842
    title: On the Origin of Magnetic Anisotropy Induced by Magnetic Annealing
    first_author: Chikazumi, S.
    year: 1955
    url: https://api.openalex.org/works/doi:10.1143/jpsj.10.842
    evidence: abstract
    locator: abstract
  quote: The magnitude of magnetic anisotropy induced by the magnetic annealing was measured as a function of composition
    for iron-nickel alloys. It is concluded that the magnitude of the anisotropy is proportional neither to the
    magnetostriction nor to the saturation magnetization. The origin of this anisotropy, therefore, can be explained
    neither by the theory of " strain of directional order " nor by the theory of " elongated order phase ". The
    result can be consistently explained by the dipole. dipole interaction in directionally ordered arrangement
    of atoms. The result is compared with Néel's formulas.
  note: Chikazumi & Oomura, J. Phys. Soc. Jpn. 10 (1955) 842-849; abstract reconstructed from the OpenAlex inverted
    index ('dipole. dipole' as fetched, i.e. dipole-dipole); full text behind a bot check.
- id: uni_phys_kuzmin2005_ms_t_shape
  phase: all
  quantity: other
  value: 'Ms(T) of most metallic ferromagnets is fixed by three quantities: Ms(0), Tc and one dimensionless shape
    parameter s'
  unit: ''
  conditions: metallic ferromagnets; analysis of experimental Ms(T) data
  source:
    doi: 10.1103/physrevlett.94.107204
    title: 'Shape of Temperature Dependence of Spontaneous Magnetization of Ferromagnets: Quantitative Analysis'
    first_author: Kuz’min, M.D.
    year: 2005
    url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=15783517&rettype=abstract&retmode=text
    evidence: abstract
    locator: abstract (PubMed 15783517)
  quote: 'Analysis of available experimental data shows that there exists a limited variety of shapes of temperature
    dependence of spontaneous magnetization. For most metallic ferromagnets the shape (as opposed to scale) of the
    M(s) versus T curve can be characterized by a single dimensionless parameter. A numerical description of the
    dependence M(s)(T) for a particular ferromagnetic material is thus reduced to evaluating three quantities: the
    saturation magnetization M(0) identical with M(s)(0), the Curie point T(C), and the shape parameter s.'
  note: 'Phys. Rev. Lett. 94 (2005) 107204 (closed; not read). PubMed renders subscripts as M(s) = Ms, T(C) = Tc.
    Functional form: see uni_phys_kuzmin_formula_perevertov.'
