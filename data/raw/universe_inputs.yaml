    title: Rare earth permanent magnets prepared by hot deformation process
    first_author: Chen, R.J.
    year: 2018
    url: https://arxiv.org/pdf/1809.09838
    evidence: full_text
    locator: Sect. 1 Introduction (arXiv version p. 2)
  quote: In the mid-1980s, R. W. Lee [1] originally reported a method to prepare an anisotropic Nd-Fe-B magnet with
    ultrafine grain size by hot pressing and die-upsetting the rapidly quenched Nd-Fe-B alloy at a high temperature.
    Compared to the traditional sintering method, the die-upsetting process can realize a strong magnetic anisotropy
    without applying an external magnetic field, which makes it appropriate to produce the ring magnets with radial
    orientation. ... It is generally acknowledged that the high anisotropy is attributed to both the rotation and
    the preferred growth of Nd2Fe14B grains under the pressure at high temperature.
  note: Review (Chin. Phys. B) read in its arXiv version 1809.09838. Rare-earth example; for an RE-free example
    of HD see uni_rt_hdext_feng2020.
