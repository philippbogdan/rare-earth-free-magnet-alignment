- id: uni_phys_field_gibbs_ludtka2005
  phase: all
  quantity: other
  value: a field changes each phase's Gibbs energy by −∫M dH; the field effect on a parent→product transformation
    is the term ∫0^H (M_parent − M_product) dH, so it requires (and scales with) a magnetization difference between
    parent and product; transformation temperatures and solvus lines shift
  unit: ''
  conditions: 'thermodynamics of phase equilibria in an applied field (worked for Fe-C: γ austenite → α ferrite),
    fields up to 30 T'
  source:
    doi: 10.2172/838516
    title: Exploring Ultrahigh Magnetic Field Processing of Materials for Developing Customized Microstructures
      and Enhanced Performance
    first_author: Ludtka, G.M.
    year: 2005
    url: https://www.osti.gov/servlets/purl/838516
    evidence: full_text
    locator: Sect. 1.1 (executive summary); Sect. 2, Eq. (2.1)
  quote: (M-H-T) magnetic equation of state space demonstrate that significantly different phase equilibria may
    result for those material systems where the product and parent phases exhibit different magnetization responses.
    These calculations show that the Gibbs free energy is changed by a factor equal to –MdH, where M and H are the
    magnetization and applied field strength, respectively. ... where M and H are defined as the magnetization and
    the magnetic intensity, respectively. This effect will be manifested in the Fe-C binary equilibrium phase diagram
    as shifts in the transformation temperatures of the various phases as well as changes in the solubility limits
    (solvus lines) of the various phases. The main requirement for this proposed magnetic process to be effective
    is that the parent and product phases need to exhibit different magnetization responses to the applied magnetic
    field.
  note: 'ORNL/TM-2005/79, Oak Ridge National Laboratory final technical report (PI G.M. Ludtka), March 2005; OSTI
    ID 838516; DOI 10.2172/838516 (resolves on api.crossref.org, type report). Eq. (2.1) as printed (garbled in
    extraction): ΔG_Fe(γ→α) = RT[ln a_Fe(γ) − ln a_Fe(α)] + ∫0^H (M_Fe(γ) − M_Fe(α)) dH; p. 26 restates the linear-in-H
    term as ''∫0H(MFeγ - MFeα)dH''. The integral sign before MdH in the executive summary is lost in extraction.'
- id: uni_phys_field_energy_scale_ludtka2005
  phase: all
  quantity: other
  value: 'energy scale of a field: about 5.5-5.6 J/mol per tesla per Bohr magneton of moment difference (≈12 J/mol/T
    for Fe at 2.2 μB; ≈360 J/mol at 30 T), comparable to mixing, ordering and formation-energy differences'
  unit: ''
  conditions: Zeeman-type magnetostatic energy of a fully magnetized phase versus a non-magnetic one
  source:
    doi: 10.2172/838516
    title: Exploring Ultrahigh Magnetic Field Processing of Materials for Developing Customized Microstructures
      and Enhanced Performance
    first_author: Ludtka, G.M.
    year: 2005
    url: https://www.osti.gov/servlets/purl/838516
    evidence: full_text
    locator: Sect. 3 (Background) and Sect. 4 (p. 25)
  quote: A magnetic flux density of 1 T augments the free energy by about 5.5 J/mole/µBohr (where µBohr is defined
    as a Bohr magneton) and because the ferromagnetic iron moment is 2.2 µBohr, the impact on free energy that is
    anticipated for iron-based materials is ~12J/mole per tesla or 360J/mole for a 30-T magnetic field. This energy
    compares with energies of mixing, ordering energies, and formation energy differences.
  note: ORNL/TM-2005/79, Oak Ridge National Laboratory final technical report (PI G.M. Ludtka), March 2005; OSTI
    ID 838516; DOI 10.2172/838516 (resolves on api.crossref.org, type report). p. 25 repeats the estimate as µBohr
    × NA = 5.6 J/(mol·T). Gives the scale of the B1 field bias on a transformation (difference in moment per atom
    × B); orientation-dependent (variant-selecting) energies are anisotropy energies, which are smaller.
- id: uni_phys_field_transformation_ohtsuka2008
  phase: all
  quantity: other
  value: a field lowers the Gibbs energy of a ferromagnetic product by its magnetostatic energy ∫M dH (the change
    for a paramagnetic parent is small and neglected), raising transformation temperatures (martensitic and diffusional);
    besides the moment difference, magnetocrystalline, shape and induced anisotropy and magnetostriction can affect
    nucleation, growth, variants and microstructure of the product
  unit: ''
  conditions: solid/solid phase transformations in Fe-based alloys in high fields (to ~10 T and above)
  source:
    doi: 10.1088/1468-6996/9/1/013004
    title: Structural control of Fe-based alloys through diffusional solid/solid phase transformations in a high
      magnetic field
    first_author: Ohtsuka, H.
    year: 2008
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5099791/
    evidence: full_text
    locator: Sect. 1 (Introduction); Sect. 2 with Fig. 2
  quote: In some solid/solid phase transformations, not only the difference in magnetic moment but also the magnetocrystalline
    anisotropy, shape magnetic anisotropy, induced magnetic anisotropy and the magnetostriction affect the nucleation
    and growth rates, transformation kinetics, variants and microstructure of product phases. ... If a magnetic
    field is applied, the free energy of the ferromagnetic product phase is decreased as shown by the dotted line
    in figure 2 . The free energy of the parent phase is also reduced but is neglected because the parent phase
    is paramagnetic and the decrease is very small. ... For diffusional transformation, the same principle can be
    applied, and it is expected that the diffusional transformation temperature is increased by applying a magnetic
    field. ... The additional energy supplied by a magnetic field is magnetostatic energy, which is the interaction
    energy between the magnetic field and the magnetic moment of the phase, and is expressed as MdH, where M stands
    for the magnetic moment of the product phase.
  note: Review, Sci. Technol. Adv. Mater. 9 (2008) 013004 (open access, PMC5099791), read as PMC HTML; the integral
    sign before 'MdH' is not rendered in the HTML text. The thermodynamic treatment is credited to Kakeshita et
    al. (pulsed-field martensite studies).
