  quote: Well-known magnetic compounds with the L10 structure, such as FePt and FePd, derive from this lower-symmetry
    crystal structure the high magnetization and significant magnetocrystalline anisotropy necessary for advanced
    permanent magnet applications. However, these compounds are under consideration only for thin-film-based devices
    for applications in magnetic recording because of the high cost of Pt and Pd, which precludes their use as components
    in bulk permanent magnets for motors and generators.
