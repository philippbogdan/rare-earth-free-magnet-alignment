# value = "<route name> (<METHOD.md code>): <definition>"; one or more sources per route
- id: uni_rt_fp_coey2012
  phase: all
  quantity: other
  value: 'Powder-metallurgy or ceramic processing with an alignment step: fully dense sintered, oriented blocks
    (FP)'
  unit: ''
  conditions: route class FP (docs/METHOD.md); also states the isotropic penalty (general, not a sample value)
  source:
    doi: 10.1016/j.scriptamat.2012.04.036
    title: 'Permanent magnets: Plugging the gap'
    first_author: Coey, J.M.D.
    year: 2012
    url: http://web.archive.org/web/20240414151014/https://www.sciencedirect.com/science/article/abs/pii/S1359646212002990
    evidence: abstract
    locator: Introduction (preview)
  quote: Processed magnets are frequently fully dense sintered, oriented blocks produced by power metallurgy or
    ceramic methods. An alignment step to orient the easy axes of all the crystallites is highly beneficial as without
    it the remanent magnetization is decreased by more than a factor of 2, and the energy product by a factor of
    4 (Eq. (7)).
  note: Closed article; read the ScienceDirect preview (abstract, Introduction, section snippets) via Wayback Machine
    capture. The section "New magnets with moderate performance" and its candidate table were not visible.
- id: uni_rt_fp_mccallum2014
  phase: all
  quantity: other
  value: 'Magnetic-field pressing + sintering (FP): single-crystal powder particles are aligned in a magnetic field,
    precompacted and vacuum sintered to a dense block'
  unit: ''
  conditions: route class FP (docs/METHOD.md); described for sintered RE magnets (today's practice)
  source:
    doi: 10.1146/annurev-matsci-070813-113457
    title: Practical Aspects of Modern and Future Permanent Magnets
    first_author: McCallum, R.W.
    year: 2014
    url: http://web.archive.org/web/20201103214544/https://digitalcommons.unl.edu/cgi/viewcontent.cgi?article=1098&context=physicsskomski
    evidence: full_text
    locator: section 'Magnets and Manufacturing', p. 461
  quote: This material is then comminuted by hydrogen decrepitation and milling to the desired particle size, at
    which each particle is a single crystal grain. These particles are aligned in a magnetic field and precompacted
    before vacuum sintering to a fully dense, sintered block.
  note: Published version deposited in DigitalCommons@University of Nebraska-Lincoln; read via Wayback Machine capture.
- id: uni_rt_fpwet_granadosmiralles2021
  phase: all
  quantity: other
  value: 'Wet field pressing + sintering (FP, wet): an aqueous slurry of hard-ferrite powder is pressed in an applied
    magnetic field, the water is removed and the pre-form is sintered (Philips process of the 1950s, still the basis
    of commercial anisotropic sintered ferrites)'
  unit: ''
  conditions: route class FP (wet; R on particles in a slurry + sintering); M-type Ba/Sr hexaferrite
  source:
    doi: 10.1088/1361-6463/abfad4
    title: On the potential of hard ferrite ceramics for permanent magnet technology—a review on sintering strategies
    first_author: Granados-Miralles, C.
    year: 2021
    url: https://arxiv.org/pdf/2309.15680
    evidence: full_text
    locator: Sect. 3.1 Conventional sintering (arXiv version, p. 6)
  quote: To prepare an anisotropic ferrite magnet, they used randomly oriented non-aggregated Ba-ferrite powder,
    which was pressed-formed as an aqueous sludge under an applied external magnetic field. The excess water was
    then removed by drying followed by the sintering of the pre-forms. This process developed in Philips Research
    Laboratories in 1950s is, with some modifications, still in use for the preparation of commercial sintered ferrite
    magnets.
  note: 'Read in the arXiv version (2309.15680) of the J. Phys. D topical review. Same source as recent_routes.yaml
    uni_rt_fpwet_granados2021 (keep one when merging). Dry field pressing + sintering: classic_routes.yaml uni_rt_fp_mccallum2014.'
