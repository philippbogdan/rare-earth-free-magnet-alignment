- id: uni_rt_shapepress_granados2021
  phase: all
  quantity: other
  value: 'Shape-induced (mechanical) orientation of platelets: uniaxial pressing of plate-like particles whose easy
    axis is normal to the plate makes them lie flat, aligning the c axes with the pressing direction without any
    field'
  unit: ''
  conditions: M-type hexaferrite platelets (easy axis = c, normal to platelet)
  source:
    doi: 10.1088/1361-6463/abfad4
    title: On the potential of hard ferrite ceramics for permanent magnet technology—a review on sintering strategies
    first_author: Granados-Miralles, C.
    year: 2021
    url: https://arxiv.org/pdf/2309.15680
    evidence: full_text
    locator: Sect. 1 and Fig. 2
  quote: This shape favors a crystallographic alignment during compaction under a uniaxial pressure, during which
    the plate-like particles will have a tendency to spontaneously lay on their larger surface side, just as a deck
    of cards would. This shape-induced orientation implicitly entails a magnetic alignment, as the easy magnetization
    axis lies parallel to the c-axis (perpendicular to the platelet plane) [52, 58], vanishing the need for an external
    magnetic field applied prior or during compaction, which considerably simplifies manufacturing the magnetic
    piece.
  note: 'New route class (not in METHOD.md list): mechanical alignment of anisometric single-crystal particles.'
