# Topic `universe` — input records (data/SCHEMA.md input format)
#
# (a) the rare-earth-free hard magnetic phases "under serious study" = phases named as permanent-magnet
#     candidates in reviews / handbook chapters (2012-2026): quantity `other`, phase = the phase,
#     value = "named as candidate in <review>", one record per (review, phase), each with its quote.
#     `conditions` says how the review treats the phase (own section / listed / historical / thin films only /
#     semi-hard ...). Evidence `abstract` also covers publisher previews (abstract + introduction + section
#     headings) and OSTI subject keywords; such records are weaker than `full_text`.
# (b) processing routes used or proposed to align (texture) permanent magnets: quantity `other`, phase `all`,
#     value = "<route name> (<docs/METHOD.md code>): <definition>".
# (c) general physics references used by the engine: quantity `other` (or `phase_fraction_limit`), phase `all`.
#
# Canonical phase names used here (aliases in brackets):
#   AlNiCo; Fe-Cr-Co; M-type hexaferrite [BaFe12O19, SrFe12O19, hard ferrite]; tau-MnAl [L1_0 MnAl, MnAl(C)];
#   LTP-MnBi [B8_1/NiAs-type MnBi]; L10-FeNi [tetrataenite]; alpha''-Fe16N2 [iron nitride]; L10-FePt; L10-CoPt
#   [PtCo]; L10-FePd; Mn-Ga (L10/D022) [MnGa, Mn3Ga]; Zr2Co11; HfCo7; Co carbides (Co2C/Co3C);
#   Co nanorods/nanowires (shape anisotropy); tetragonal Fe-Co [L1_0 FeCo, tet-FeCo, strained bct FeCo];
#   epsilon-Fe2O3; Fe3Se4; Mn4N [Mn-Sn-(Co)-N with Mn4N-like phase]; (Fe,Co)2B; Fe2P-based; Fe-B borides;
#   Fe-Ta; high-entropy alloys (a class, not a phase).
# Quotes are verbatim from the page/file in `url` (whitespace and line-break hyphenation normalised;
# sub/superscripts flattened, e.g. "L10" = L1_0, "T c" = Tc). Where a PDF text layer mis-renders a glyph the
# quote gives the printed character and the note says so. No outcome values (remanence/texture of samples)
# are in these quotes; outcomes met on the way are in .tmp/sealed/universe_outcomes.yaml (sealed) and
# data/raw/known_cases_universe.yaml (known cases: columnar field-aged AlNiCo; hot-extruded MnAl-C).

# ===== (a) PHASES: rare-earth-free hard phases named as permanent-magnet candidates in reviews =====
# one record per (review, phase); value = "named as candidate in <review>"; see conditions for how the review treats it
