    evidence: full_text
    locator: p. 48 (Discussion 5.3)
  quote: The present alloy seems to behave according to Cahn's model. In the early stage of aging, decomposition takes place
    isotropically when the magnetostatic energy dominates over the elastic energy, and the FeCo rich phase grows in parallel
    to the direction of the applied field. But when the aging time exceeds 1 hr, the elastic energy gradually becomes greater
    than the magnetic energy, aligning the Fe-Co rich phase along the elasticity soft (100) cubic directions (see Fig. 36),
    resulting in a decreasing efficiency of the elongation.
  note: Quote is from a tesseract OCR of the scanned PDF (saved in local_text); OCR renders alpha1/alpha2 as "a,", "a1", "@,",
