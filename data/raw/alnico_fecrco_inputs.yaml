# Inputs for topic alnico_fecrco: AlNiCo and Fe-Cr-Co spinodal magnets
# (shape anisotropy of elongated Fe-Co-rich alpha1 particles in a weakly magnetic alpha2 matrix).
# Format: data/SCHEMA.md input records. Every value carries a verbatim quote; table cells are joined by ' | ',
# omissions are marked '[...]'. Japanese passages are quoted in the original with a translation in `note`.
# Phase names used:
#   AlNiCo                         - the two-phase alnico magnet alloy as a whole (grade in `conditions`)
#   AlNiCo alpha (bcc/B2 parent)   - homogeneous high-temperature parent (solidification texture, Tc of the
#                                    homogeneous phase, miscibility gap)
#   AlNiCo alpha1 (Fe-Co-rich)     - ferromagnetic rods (B2), coherent with alpha2
#   AlNiCo alpha2 (Ni-Al-rich)     - weakly/non-magnetic matrix (B2 or L21)
#   AlNiCo gamma (fcc)             - detrimental high-temperature phase
#   Fe-Cr-Co, Fe-Cr-Co alpha (bcc parent), Fe-Cr-Co alpha1 (Fe-Co-rich), Fe-Cr-Co alpha2 (Cr-rich), Fe-Cr-Co sigma
# Composition records use quantity `other` with value 'composition: ...'.
# Parent (bcc) textures of printed / cast material are recorded here as inputs (conditions for the conditional
# prediction), as instructed for this topic; measured remanence of any route is only in the sealed outcome file.
# Unit conversions (G, kG, emu/cm3, C -> SI/K) were done by the collector and are stated in `note`.
# Quotes from scanned PDFs either come from tesseract OCR (artefacts such as 'a,' for alpha1, 'o' for sigma, 'y' for
# gamma, '(100)' for <100> are kept verbatim and flagged in `note`) or were transcribed from the page image (flagged).

