  quote: Since magnetostatic and elastic energy anisotropy favor different decomposition directions, the dominant energy will
    be responsible for the final structure. Magnetostatic anisotropy favors the magnetic field direction and elastic energy
    favors {100} planes. If both of these are aligned, such as in columnar grained alnico, the result is very well defined
    rods along [100] with high shape anisotropy and coercivity. However, if both energies are approximately equal but unaligned,
    a combination of both will result, and a crosshatching of spinodal rods is observed [48], [51]. If the magnetostatic energy
    is considerably larger than the elastic energy, the spinodal will ignore crystallographic preferences and will decompose
    into rods parallel to the magnetic field. This only becomes the case when the material is near its Curie temperature.
  note: ''
