  source:
    doi: 10.3390/app9224843
    title: Processing of Alnico Magnets by Additive Manufacturing
    first_author: White
    year: 2019
    url: https://mdpi-res.com/d_attachment/applsci/applsci-09-04843/article_deploy/applsci-09-04843.pdf
    evidence: full_text
    locator: Sec. 1
  quote: To produce alnico 9 magnets with the highest energy product (BHmax ~ 10.5 MGOe), directionally solidified casting
    is required to align grains primarily along the <001> direction with considerable cost, time, and complexity [7,11,14].
    Significant machining of these castings into final shapes removes the un-textured exterior surfaces to yield the highest
    energy product, but with only a coercivity of 1.5 kOe.
  note: ''
