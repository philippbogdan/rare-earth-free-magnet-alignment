- id: kc_alnico5DG_57_history_cui2022
  phase: AlNiCo
  route: DS+FA
  process: chill-surface oriented crystal growth (5DG); plus field processing of the improved structure (5-7)
  conditions:
    grade: Alnico 5DG, Alnico 5-7
    field_T: null
    T_process_K: null
    parent_texture: '5DG: partially oriented (chill-surface growth); 5-7: columnar <100>'
    magnet_axis: columnar axis
    density_rel: null
  quantity: process_description
  value: '5DG: alnico 5 quenched from the melt on a chilled surface (oriented crystal growth); 5-7: further field processing
    of the improved structure, same composition as alnico 5'
  unit: text
  uncertainty: null
  measured_along: ''
  measurement: ''
  n_samples: '-'
  source:
    doi: 10.1007/s11837-022-05156-9
    title: 'Manufacturing Processes for Permanent Magnets: Part I—Sintering and Casting'
    first_author: Cui
    year: 2022
    url: https://dr.lib.iastate.edu/handle/20.500.12876/EzR2oBlz
    evidence: review
    locator: alnico section
  quote: The next significant improvements in properties were made by processing; alnico 5 was quenched from the melt on a
    chilled surface to obtain oriented crystal growth, grade 5DG. Further improvement was accomplished by field processing
    of the improved structure to produce grade 5–7. Since the 5–7 composition was the same as alnico 5 but with markedly improved
    properties, instead of naming it 7, it was given the hyphenated name alnico 5–7.
  note: Review statement. Dillon 2014 (thesis) instead lists only 5-7 and 9 as grades with columnar grain structure (see inputs).
- id: kc_alnico9_process_zhou2019
  phase: AlNiCo
  route: DS+FA
  process: DS casting (heated mould, chilled bottom plate); solutionise ~1250 C, air cool to ~800 C, MA ~800 C with field
    along casting direction, draw ~640 C
  conditions:
    grade: Alnico 9 (Arnold)
    field_T: null
    T_process_K: 1073
    parent_texture: columnar <001>, some misoriented grains near the edge (EBSD)
    magnet_axis: casting direction = field
    density_rel: null
  quantity: process_description
  value: see quote
  unit: text
  uncertainty: null
  measured_along: ''
  measurement: ''
  n_samples: '-'
  source:
    doi: 10.1016/j.jmmm.2018.09.085
    title: Microstructure and coercivity in alnico 9
    first_author: Zhou
    year: 2019
    url: https://www.osti.gov/servlets/purl/1477200
    evidence: full_text
    locator: Sec. 2 Experimental procedure
  quote: It was a directionally solidified alloy with most grains aligned along the [001] direction and was produced by casting
    into a heated mold with a chilled bottom plate. The cast alloys were heat-treated at about 1250 ºC to fully solutionize
    the alloy then air-cooled to about 800 ºC, followed by a magnetic field annealing process at ~800ºC with an external magnetic
    field along the grain aligned/casting direction. Finally, the alloy underwent an extended ‘draw’ cycle with slow cooling
    and a temperature hold at approximately 640 ºC.
  note: ''
