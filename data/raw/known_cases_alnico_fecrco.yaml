  source:
    doi: 10.1016/j.actamat.2018.07.049
    title: Current progress and future challenges in rare-earth-free permanent magnets
    first_author: Cui
    year: 2018
    url: https://dr.lib.iastate.edu/handle/20.500.12876/7140
    evidence: review
    locator: Sec. 4
  quote: The higher (BH)max of Alnico -5-7 and Alnico 9 is due to their grain alignment. The grain alignment is achieved by
    solidifying in molds with a large temperature gradient which biases the growth of the high temperature cubic phase along
    their <100> axes. [...] In Alnico-8 and 9 alloys, the growth of a1 is biased by the application of magnetic ﬁeld while
    annealing near the spinodal onset temperature [121,122].
  note: ''
