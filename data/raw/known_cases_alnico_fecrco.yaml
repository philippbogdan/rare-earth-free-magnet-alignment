# Known case (visible, PROBLEM.md): AlNiCo made anisotropic by ageing columnar, directionally solidified <100>
# grains in a field (Alnico 5-7 / Columax / ArKomax 800, Alnico 9; Alnico 5DG = directional-grain, partially
# oriented). Records follow the outcome format of data/SCHEMA.md; besides Br they include Hcb/Hcj (kA/m) and
# BHmax (kJ/m3) as requested, and `process_description` records describing how the grades are made.
# Js of the same compositions is in data/raw/alnico_fecrco_inputs.yaml (Alnico 5 composition: ~1.43-1.46 T;
# Alnico 8/9 composition with 5 wt% Ti: ~1.19 T).

- id: kc_alnico_columnar_mmpa_desc
  phase: AlNiCo
  route: DS+FA
  process: columnar casting + field heat treatment
  conditions:
    grade: Alnico 5-7, Alnico 9
    field_T: null
    T_process_K: null
    parent_texture: columnar <100> (directionally solidified)
    magnet_axis: columnar axis = field direction
    density_rel: null
  quantity: process_description
  value: best properties with columnar or single-crystal structure, magnetisation parallel to the columnar axis; 5-7 and 9
    are the columnar grades
  unit: text
  uncertainty: null
  measured_along: ''
  measurement: ''
  n_samples: '-'
  source:
    doi: null
    title: 'MMPA Standard No. 0100-00: Standard Specifications for Permanent Magnet Materials'
    first_author: Magnetic Materials Producers Association
    year: null
    url: https://www.duramag.com/wp-content/uploads/MMPA_0100-00.pdf
    evidence: datasheet
    locator: Section II, 2.0 and 5.3.1.3
  quote: The magnetic performance of most grades can be increased in a preferred direction by applying a magnetic field during
    heat treatment thus producing magnetic anisotropy. [...] The best properties of cast Alnico magnets are achieved with
    columnar or single crystal structure with the direction of magnetization parallel to the columnar grain axis. [...] apply
    to the columnar materials (Alnico 5-7 and Alnico 9) which are particularly crack-prone due to their columnar grain.
  note: ''
