  quote: С-домены в пластине и пластины в пачке сочленяются по различным плоскостям типа {110}. ... Как показано в [14, 26, 27], сложное иерархическое строение упорядоченной ГЦТ фазы (С-домены—блоки—пластины—пачки) обусловлено стремлением кристалла до минимума уменьшить упругую энергию, связанную с внутренними напряжениями. ... Согласно электронно-микроскопическим наблюдениям [6 — 10, 14] когерентные двойниковые границы С-доменов не содержат дислокаций и свободны от внутренних напряжений, т.е. являются инвариантными.
