    locator: Sec. III (arXiv preprint cond-mat/0203544, p. 2)
  quote: The ‘tweed contrast’ corresponds to a uniform pattern formed by small (1–10 nm) ordered domains with a dominant {101} orientation of interfaces and essentially random distribution of the c-axis directions. When the growing ordered domains reach some characteristic size (10-20 nm), a new pattern develops, with the formation of large ‘polytwinned’ stacks containing ordered ‘bands’ (‘c-domains’) with two alternating directions of the c-axis making π/2 angles with each other. The interfaces between the c-domains within a polytwinned stack are all parallel to each other and lie in one of the 101 planes. ... Physically, polytwinning is explained by the fact that such structures eliminate the volume-dependent part of the elastic energy stemming from the coexistence of ordered domains with different c-axis directions
  note: Quote from the arXiv preprint of the JMMM paper ('one of the 101 planes' printed without braces in the preprint).
