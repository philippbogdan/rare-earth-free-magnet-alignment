  quote: Bulk Fe-Pd L10 alloys self-assemble into the so-called polytwin microstructure, which forms as a means of reducing the transformation strain energy accrued during the cubic→tetragonal transformation from A1 [11,12]. As shown in Fig. 1b, a prototypical L10 polytwin colony consists of alternating conjugate pairs of L10 orientation variants whose c-axes (shown as the double headed arrows) lie along two of the three ⟨100⟩ directions of the parent A1 phase. ... The twin boundaries separating the L10 orientation variants are coherent {110} planes which we will refer to as orientation domain boundaries (ODBs).
  note: Angle brackets appear as glyph artifacts in the text layer; checked on the page image. Accepted-manuscript PDF via NSF PAR.
