# Topic l10: L1_0 ordered phases formed by chemical ordering of a disordered fcc (A1) parent.
# INPUT records (visible). Schema: data/SCHEMA.md. Evidence rules: verbatim quotes from fetched pages.
#
# Phase names used in this file:
#   L10-FeNi  tetrataenite (ordered FeNi);           A1-FeNi  disordered fcc parent (taenite)
#   FeNiN     tetragonal nitride intermediate of the NITE route (nitrogen insertion + topotactic extraction)
#   L10-FePt, A1-FePt;  L10-CoPt, A1-CoPt;  L10-FePd, A1-FePd;  L10-generic (statements about the L1_0 class)
#
# Conventions: Js in T (mu0*Ms, ~300 K), Ms_mass Am2/kg, K1 MJ/m3, Tc and all temperatures in K
# (deg C + 273.15, conversion stated in note), density g/cm3, lattice in Angstrom, stress in MPa.
# Ranges are given as text "lo-hi". Values converted from other units keep the original unit in the quote.
# Quotes: verbatim; only whitespace normalisation, re-joining of words split by line-end hyphenation and
# restoration of glyphs lost in PDF text layers (superscripts, degree signs, brackets) - stated in note
# where it matters. Own arithmetic or comparisons appear only in `note` and are labelled as such.
# evidence: full_text = text read; abstract = only abstract accessible; review = value quoted by a
# secondary source (the cited original was not read).
# Outcome data (variant fractions, macroscopic anisotropy, Mr/Ms, Br, texture of samples) are sealed in
# .tmp/sealed/l10_outcomes.yaml.
