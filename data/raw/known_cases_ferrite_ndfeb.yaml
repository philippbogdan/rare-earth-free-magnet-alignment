- id: nd2fe14b_fp_br_rodewald2002
  phase: Nd2Fe14B
  route: FP
  process: sintered Nd-Fe-B by powder metallurgy; powder alignment in a constant field plus alternating field pulses (parallel/antiparallel to easy axis)
  conditions:
    field_T: null
    T_process_K: null
    parent_texture: none
    magnet_axis: alignment direction
    density_rel: null
    alignment: constant field + alternating field pulses
  quantity: Br
  value: 1.519
  unit: T
  measured_along: alignment direction
  measurement: remanent polarization; method not stated in abstract
  n_samples: best magnet reported
  source:
    doi: 10.1109/tmag.2002.803075
    title: Top Nd-Fe-B magnets with greater than 56 MGOe energy density and 9.8 kOe coercivity
    first_author: Rodewald, W.
    year: 2002
    url: https://api.openalex.org/works/doi:10.1109/tmag.2002.803075
    evidence: abstract
    locator: abstract
  quote: Besides the composition of the alloy, the alignment of the powder particles is decisive for achieving high remanent polarizations. The alignment of the powder particles can be improved by applying
    field pulses in addition to an alignment in a constant magnetic field. Alternating field pulses parallel and antiparallel to the easy axis proved to be more efficient than unidirectional field pulses.
    By such a refined processing route sintered Nd-Fe-B magnets with a remanent polarization of 1.519 T, a coercivity H/sub cJ/ of 7.8 kA/cm (9.8 kOe), and a maximum energy density of 451 kJ/m/sup 3/ (56.7
    MGOe) could be prepared.
  note: Vacuumschmelze lab result. Composition, density and Js not in abstract.
