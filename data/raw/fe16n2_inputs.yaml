  quote: In nitrogen-martensite the same proportion of the octahedral interstices at ½, ½, 0 and 0, 0, ½ of the body-centred tetragonal iron-atom lattice is randomly occupied. Nitrogen-austenite and nitrogen-martensite are therefore isostructural with the corresponding iron-carbon alloys.
  note: Sites ½,½,0 and 0,0,½ are the octahedral interstices whose tetrad axis is c, i.e. N sits on ONE of the three octahedral sublattices, the one selected by the Bain correspondence (c of each martensite variant = the contracted cube axis of the parent austenite). Ordering to alpha" then happens within this sublattice, so the martensite c axis is kept (see Jack 1951b, Koyano 2000, Böttger 1997 records).
