# fe16n2 — INPUT records (visible). Topic: α''-Fe16N2 (body-centred tetragonal, I4/mmm, 2 ordered N per 16 Fe
# on one octahedral sublattice; easy axis c).
# Phase names used in this file:
#   "α''-Fe16N2"  hard phase (ordered nitride)
#   "α'-Fe8N"     N-martensite (bct, N disordered on the c-type octahedral sublattice), parent of α'' on the Jack route
#   "γ-Fe(N)"     N-austenite (fcc), parent of α'
#   "α-Fe"        bcc iron, parent for direct low-temperature nitriding (and reference for strain)
#   "γ'-Fe4N"     decomposition / competing phase
# Records follow data/SCHEMA.md; every value carries a verbatim quote from the source page/file named in `url`.
# Sources without a Crossref DOI (patents, theses, reports, slides, DataCite posters) have doi: null or a note.
- id: fe16n2_js_kim1972
  phase: α''-Fe16N2
  quantity: Js
  value: 2.58
  unit: T
  conditions: polycrystalline Fe–N films evaporated in N2 (2e-5 to 7e-3 Torr) on glass; multiphase film; room temperature
  source:
    doi: 10.1063/1.1654030
    title: New Magnetic Material Having Ultrahigh Magnetic Moment
    first_author: T. K. Kim
    year: 1972
    url: https://api.crossref.org/works/10.1063/1.1654030
    evidence: abstract
    locator: abstract
  quote: We found a new magnetic material which has the highest saturation magnetization at room temperature, 2050 G, among those of all the magnetic materials. This was attributed to Fe16N2, which has a bct structure, and the magnetic moment associated with Fe atoms of Fe16N2 was deduced to be 3.0 μB.
  note: First 'giant moment' report. 2050 G read as CGS Ms (emu/cm3) of the film -> 4π·2050 G = 25.8 kG = 2.58 T (conversion and CGS reading by collector). The 3.0 μB/Fe is the moment deduced for Fe16N2 (phase fraction correction), i.e. higher than the film value; Okamoto 1996 cites it as 28.3 kG for α''.
