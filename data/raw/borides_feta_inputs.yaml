  unit: ''
  conditions: ''
  source:
    doi: 10.1103/PhysRevB.92.174413
    title: Magnetic properties of (Fe1−xCox)2B alloys and the effect of doping by 5d elements
    first_author: Edström
    year: 2015
    url: https://doi.org/10.1103/PhysRevB.92.174413
    evidence: abstract
    locator: abstract
  quote: Using density functional theory based calculations we have explored the effect of substitutionally doping
    the transition metal sublattice by the whole range of 5 ⁢ 𝑑 transition metals and found that doping by Re or
    W elements should significantly enhance the magnetocrystalline anisotropy energy. Experimentally, W doping did
    not succeed in enhancing the magnetic anisotropy due to formation of other phases. On the other hand, doping
    by Ir and Re was successful and resulted in magnetic anisotropies that are in agreement with theoretical predictions.
    In particular, doping by 2.5 at. % of Re on the Fe/Co site shows a magnetocrystalline anisotropy energy which
    is increased by 50% compared to its parent ( F e 0 . 7 ⁢ C o 0 . 3 ) 2 ⁢ B compound, making this system interesting,
  note: Experimental Re increase reported in the abstract; parent and doped absolute K1 values are not quoted here.
