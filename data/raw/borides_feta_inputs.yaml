  source:
    doi: 10.1021/cm060068z
    title: Ferromagnetic Iron Boride (Fe3B) Nanowires
    first_author: Li
    year: 2006
    url: https://pubs.acs.org/doi/10.1021/cm060068z
    evidence: abstract
    locator: abstract
  quote: 'Single-crystal iron boride (Fe ₃ B) nanowires were synthesized on Pt and Pd (Pt/Pd) coated sapphire

    substrates by a chemical vapor deposition method at 800 ° C using boron triiodide (BI ₃ ) and iron iodide

    (FeI ₂ ) as precursors. Morphology of the Fe ₃ B nanowires can be controlled by manipulating the Pt/Pd

    film thickness and the growth time. Transmission electron microscopy and selected area electron diffraction

    were used to analyze the crystal structures of these novel materials. Electron energy-loss spectroscopy

    and X-ray energy-dispersive spectroscopy studies on these nanowires confirm that they are composed of

    boron and iron. Scanning electron microscopy was employed to observe the morphology of these

    nanomaterials. The typical size of the iron boride nanowires is about 5−50 nm in width and 2−30 μm

    in length.'
  note: Morphology alone does not establish easy-axis alignment.
