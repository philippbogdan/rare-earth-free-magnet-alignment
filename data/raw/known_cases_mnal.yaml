    locator: Example 2
  quote: 'From a casting having a composition of 71.73% Mn, 27.39% Al and 0.88% C, as chemically analyzed, a 20
    mm cubic test billet was cut out. Then after subjecting said test billet to heat treatment at a temperature
    of 1150° C for 2 hours, it was gradually cooled to 830° C at a cooling rate of 10°˜15° C/min, and was then held
    at 830° C for 15 minutes. It was quenched from 830° C at a cooling rate of about 700° C/min. After the above
    heat-treatment, the test billet was found to consist of ε-phase crystals and lamellae of a compound Mn 3 AlC.
    ... Said test billet was extruded with a dummy billet through the plane-symmetric converging die mentioned hereinabove,
    whose reduction of area was 75%. Extrusion temperature was at 750° C and punch speed was 5 mm.sec. -1 . The
    extruded product was sound and without any ruptures. Thereafter, it was tempered at 550° C for 30 min. Then,
    magnetic properties were measured in the extrusion direction. The result was as follows: Br = 5800 G Bhc = 2350
    Oe (BH)max = 5.8×10 6 G.Oe'
  note: converted from 5800 G. Rectangular 20 x 5 mm product; compression only in one transverse direction (plane
    strain), slightly worse than axisymmetric extrusion per the patent.
