  quote: Furthermore, as disc test pieces with their preferred direction of magnetization in the direction parallel
    to the disc surface were cut out from the respective test pieces having the above mentioned magnetic characteristics,
    and their magnetic torques were measured. Every test piece gave a unidirectional magnetic torque curve. The
    magnetic torques of these test pieces were found falling within the range of 0.63 - 0.86 × 10 7 dyne-cm/cm 3
    . Then, if the degree of anisotropization is expressed by its ratio to the magnetic torque of 1.07 × 10 7 dyne-cm/cm
    2 of the τ c monocrystal of Example 3, all of these test pieces gave such high degrees of anisotropization as
    above about 0.6. Especially the test piece with (BH) max = 6.3 × 10 6 G.Oe obtained by extruding an alloy of
    the composition of P 5 was found to have the high magnetic torque of 0.86 × 10 7 dyne-cm/cm 3 , and be excellent
    in orientation, and was thus identified as an anisotropic magnet having a very high degree of anisotropization.
  note: 0.80 = 0.86/1.07 computed here from the printed torques (patent calls the ratio 'degree of anisotropization';
    all Example 14 extruded/upset pieces > about 0.6). Not equal to A; for an ideal fibre the torque ratio scales
    with a texture moment, not <cos>.
