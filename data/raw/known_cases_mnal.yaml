  quote: The test specimen of No. 17 of Example 15 was subjected to homogenization and quenching treatment similarly
    as in Example 15 and to a tempering at 600°C for 30 minutes after a quenching, and in the same way as in the
    preceding example, was extruded by an extruding pressure of 12.6 tons at a surface reduction percentage of 75%.
