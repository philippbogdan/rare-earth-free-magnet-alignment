  quote: 'A test piece having the composition of P 4 was extruded to a degree of 65%, at a pressure of 40 kg/mm
    2 and a temperature of 720°C, and in the axial direction of the cylinder. The degree of extrusion is expressed
    by the percentage of the decrease in the sectional area of the test piece, as measured before and after being
    extruded. The test piece which had been subjected to the extrusion was found to be an excellent anisotropic
    magnet with its preferred direction of magnetization in the axial direction of the extruding direction, namely,
    the axial direction of the cylindrical test piece, and its magnetic characteristics in the preferred direction
    of magnetization were: Br = 6,100 G .sub.B Hc = 2,200 Oe (BH).sub.max = 5.5 × 10.sup.6 G.Oe'
  note: converted from 6100 G (5.5 x10^6 G.Oe).
