    as shown in Table 11. ... b 530 3150 1350 1.5 ... The test specimens of Codes b, c and k were almost isotropic,
    and the test specimens of d and j were lower in the degree of anisotropization than those of e - j. That is
    to say, only by the warm deformation at 600° - 780°C, preferably 650° - 780°C, anisotropic magnets showing a
    high degree of anisotropy were obtained.
