    i.e., remarkable shrinkage in the direction of the compression was observed, and notable elongation was recognized
    in the only one direction perpendicular to the compression direction. The direction where notable elongation
    was recognized is nearly the same as the direction of easy magnetization of the obtained τ-phase single crystal.
