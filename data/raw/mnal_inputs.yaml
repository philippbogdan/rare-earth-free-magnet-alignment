    title: On the plate-like τ-phase formation in MnAl–C alloys
    first_author: Sologubenko, Alla S.
    year: 2004
    url: https://www.research-collection.ethz.ch/server/api/core/bitstreams/cac30854-61d1-4363-b1ce-acec9889c4d3/content
    evidence: full_text
    locator: abstract
  quote: As ɛ′-domains evolve, elastic strains increase at the ɛ′-interfaces until shear occurs in ɛ′-domains to
    reduce the transformation strains. Stacking faults appear between ɛ′-domain boundaries. Polytypes are the result
    of a shuffling of the stacking faults within ɛ′-domains. Finally, the ɛ′-domain boundaries are overcome by the
    collective motion of transformation dislocations which form twinned τ-plates.
  note: 'Full text read (ETH Research Collection copy); abstract text from Crossref (uses U+025B for epsilon). Paper
    keyword: "Stress-induced transformation". Also published as Z. Metallkd. 95 (2004) 486, doi:10.3139/146.017981.'
