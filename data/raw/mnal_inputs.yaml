    evidence: full_text
    locator: Section 1, last paragraph; Fig. 2c (EBSD (0001) pole figure)
  quote: In this work, we demonstrate that LPBF can be used to produce MnAl(C) in its high-temperature polymorph
    (ε-phase), with a strong alignment of the <002> directions parallel to the build direction.
  note: Same paper reports by EBSD 'the <001> directions were in parallel to the build direction (although some
    misalignment of the poles was also observed)'; a second map showed an extra pole at an orthogonal direction.
    Texture strength depended on scan strategy/parameters. Measured texture values are in the known-case file.
