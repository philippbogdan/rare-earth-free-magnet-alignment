  quote: Two mechanisms have been proposed to describe this transformation and they are massive transformation [12–14]
    and the displacive-diffusional mechanism [15–17]. Both mechanisms could occur simultaneously during the phase
    transformation from ε to τ, but the massive transformation is thought to be dominant in polycrystals and at
    temperatures above 500 °C [18].
  note: pdftotext renders the ranges '[12–14]' as '[12e14]' and drops the degree sign; quote as extracted.
