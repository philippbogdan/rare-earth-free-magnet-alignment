    first_author: Keller, Thomas
    year: 2023
    url: https://par.nsf.gov/servlets/purl/10467334
    evidence: full_text
    locator: Section 4.4 (EBSD)
  quote: The selection of one out of the three possible ε’ phase variants in a given ε phase grain is most likely
    due to stress retained from the thermal contraction of quenching as well as the stress between grains during
    the lattice contraction associated with ε’ ordering. This is due to the anisotropic elastic properties of the
    ε’ phase, making the ε’ variant with a softer direction aligned to the stress more favorable than the others
    [7,10].
  note: 'Same section: some grains show several epsilon'' variants, others one dominant variant; tau grows into
    ordered epsilon'' regions, not directly into disordered epsilon. The intro of this paper also summarises Zhang
    C. et al. 2018 (single tau variant under uniaxial stress) - recorded in the sealed outcome file.'
