    forms rather by the massive mode, it was shown in Ref. [2] that both transformation mechanisms can operate within
    the same sample. The plate-like s-phase nucleates within grains of the ephase and has a crystallographic correspondence
    with the matrix phase.
  note: PDF text layer renders tau as "s", epsilon as "e", epsilon-prime as "e0" and the arrow as "!"; quote kept
