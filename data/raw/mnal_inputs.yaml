    evidence: full_text
    locator: Section 3.2.3, p. 5
  quote: Based on the diffraction analysis, these micro-twins show a true or pseudo twin relationship. These twins
    show a total length more than 7 μm and are terminated at the grain boundaries on one side. Similar twin structures
    were also reported by Yanar et al. [12] in massively transformed τ-phase and the formation of the planar defects
    was attributed to the growth faults produced during atomic attachment at the migrating interfaces. Wiezorek
    et al. [18] also reported plate-like τ-phase could be produced via a hybrid displacive-diffusional mechanism
    which was associated with the interface of massive transformed τ-phase and the parent ε phase. In both phase
    transformation mechanisms, strain leads to the motion of partial dislocations, which produce the twins in the
    microstructure.
  note: ''
