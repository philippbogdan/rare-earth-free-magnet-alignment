  quote: At 315 ◦ C, the initial evidence of the [1 0 1] and [0 1 0] superlattice ε’ peaks begin to appear, coinciding
    with the DSC exotherm passing its maximum and the onset of the T-VSM peak. From 315 to 450 ◦ C the ε’ peaks
    grow in intensity without any evidence of the [0 0 1] τ superlattice peak. This therefore represents a period
    of nucleation and growth of the ε’ phase prior to the formation of τ, and combined with the T-VSM data corroborates
    the FM behavior of ε’ compared to ε. Above 450 ◦ C the τ phase is shown to rapidly nucleate and grow in intensity,
    as evidenced by the [0 0 1] and [1 0 0] τ superlattice peaks, as well as the [1 1 0] and [0 0 2] fundamental
    τ peaks.
