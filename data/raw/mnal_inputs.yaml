    first_author: Palanisamy, Dhanalakshmi
    year: 2016
    url: https://repository.ias.ac.in/135256
    evidence: abstract
    locator: abstract
  quote: This paper outlines the detailed procedure for the synthesis of pure ferromagnetic τ phase in binary Heusler
    Al-55 pct Mn alloy in bulk form through casting route without any addition of stabilizers. To obtain the processing
    domain for the formation of the τ phase from high-temperature ε phase, isothermal transformation experiments
    were carried out. The structure and microstructure were characterized by X-ray diffraction and electron microscopy
    studies. The τ phase start times were obtained through magnetic measurements. In order to tune the casting conditions
    for the formation of this phase, thermal modeling was carried out to predict the heat extraction rates for copper
    molds of different diameters (2 to 12 mm) containing hot solids during casting process. This enabled us to estimate
    the diameter of the mold to be used for obtaining τ phase directly during casting. It was concluded through
    experimental verification that 10-mm-diameter casting in copper mold is suitable to obtain complete τ phase.
  note: Abstract only (full text closed). The paper also reports TTT (tau start times) from magnetic measurements;
    values not available.
