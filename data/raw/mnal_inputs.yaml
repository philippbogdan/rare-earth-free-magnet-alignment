  quote: However, the downward tendency of M reversed at temperatures above 510 K and 540 K for MnAl and MnAlC,
    respectively, indicating transformation of paramagnetic ε/ε’ to ferromagnetic τ-phase. The magnetizations of
    MnAl and MnAlC do not vary too much at 510–650 K and 540–766 K, respectively, indicating the occurrence of additional
    magnetization in compensation of the thermal driven magnetization loss in this temperature range. The PT during
    this stage was slow and was ascribed to the displacive PT, which is a low temperature diffusionless process
    involving co-operative shear movements of atoms on (001) ε’ along [010] ε’ that produces the final tetragonal
    lattice of τ-phase. A sharp magnetization increase was observed at temperatures above 650 K and 766 K for MnAl
    and MnAlC, respectively, indicating occurrence of high-rate PT in the samples.
