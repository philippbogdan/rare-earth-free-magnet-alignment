  quantity: stress_effect_on_formation
  value: tau plates form in twin pairs because the long-range stress of one plate is cancelled by a second plate
    of opposite dislocations (self-accommodation); an external stress can therefore favour one member of the pair
  unit: qualitative
  uncertainty: null
  conditions: as mnal_stress_effect_on_formation_sologubenko2004a
  source:
    doi: 10.1515/ijmr-2004-0097
    title: On the plate-like τ-phase formation in MnAl–C alloys
    first_author: Sologubenko, Alla S.
    year: 2004
    url: https://www.research-collection.ethz.ch/server/api/core/bitstreams/cac30854-61d1-4363-b1ce-acec9889c4d3/content
    evidence: full_text
    locator: Section 4 (Discussion), p. 490
  quote: As proposed by Müllner et al. [10], a single s-plate forms by the collective motion of a large number of
    dislocations of the same type and sign. The long-range stresses associated with such a plate cancel if a second
    plate forms with an equal number of opposite dislocations. Thus, the two plates form twins.
  note: Quote copied from the PDF text layer, in which the symbol-font tau is rendered as "s" ("s-plate" = tau-plate);
    the page number "490" interrupts the sentence in the extracted text. The last clause of value (external stress
    favours one twin) is an inference, not stated by the authors.
