  quote: The flower-like s-phase forms by a compositionally invariant, diffusion-controlled massive transformation
    [3 – 5]. The nucleation of the flower-like s-phase takes place mainly at grain boundaries of the parent e-phase.
    As a re486 sult, a new grain structure evolves without predictable lattice correspondence with the matrix phase.
