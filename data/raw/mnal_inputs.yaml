- id: mnal_twins_zhao2021b
  phase: tau-MnAl-C
  quantity: twins
  value: 'order twin in a recrystallised grain: misorientation about 86 deg, equivalent to 120 deg about (111);
    true twins dominate after hot deformation'
  unit: ''
  uncertainty: null
  conditions: die-upset Mn53Al45C2 (700 C, logarithmic strain 1.386, 0.001 1/s), TEM
  source:
    doi: 10.1016/j.jallcom.2020.156998
    title: Microstructural defects in hot deformed and as-transformed τ-MnAl-C
    first_author: Zhao, P.
    year: 2021
    url: https://oa.tib.eu/renate/server/api/core/bitstreams/187f02b1-6f29-4daf-99bd-f5fff2989ef3/content
    evidence: full_text
    locator: Section 3.3.3, p. 6
  quote: In addition to true twins found in the recrystallised grains, an order twin with sharp interface are also
    observed as shown in Fig. 9(b). As the zone axis of twin and matrix are both parallel to the electron beam,
    they appear the same diffraction contrast. The diffraction pattern in the top right corner of Fig. 9(b) was
    taken from the area marked with dashed circle and could be indexed with [010] zone axis with the misorientation
    angle about 86° . Considering the symmetry operations of τ-MnAl, it is equivalent to 120° /(111). Due to the
    limitations of TEM, it is impractical to check all the twin boundaries formed in the samples. In TiAl phase
    which has the same L10 structure as τ-MnAl, Inui et al. showed the formation energy ratio of true twin, order
    twin and pseudo twin is roughly to be 1:2:3 or 1:6:7 to explain why true twins are more common to be observed
    [42]. Based on the EBSD analysis, Bittner et al. also confirmed true twins are the dominant twin type in τ-MnAl-C
    after hot extrusion [25].
  note: Includes Inui et al.'s formation-energy ratio for L1_0 TiAl (true:order:pseudo roughly 1:2:3 or 1:6:7) as
    explanation why true twins are most common; and Bittner et al.'s EBSD finding that true twins dominate after
    hot extrusion.
