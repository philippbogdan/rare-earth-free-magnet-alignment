    first_author: Si, Ping-Zhan
    year: 2017
    url: https://mdpi-res.com/d_attachment/materials/materials-10-01016/article_deploy/materials-10-01016.pdf
    evidence: full_text
    locator: p. 7, Sect. 3.4
  quote: Second, the rate of the propagation of the massive transformation front ranges from 8 nm/s to 60 nm/s,
    depending on the front shape. The propagation rates of the inter-phase interface with arcshape, straight shape,
    and sharp-angle tip of τm are ~8, ~10, and ~16 nm/s, respectively. The ε/ε’ phase in the sharp angle in-between
    two τm grains transforms at a rate up to 60 nm/s, which slows down quickly when the sharp angle becomes obtuse
    due to ε/ε’→τ transformations. It should be noted that the high rate area is very limited while most linear
    growth rates are falling in the range 8–16 nm/s. Yanar et al. analyzed the growth kinetics of the τ phase in
    the Mn-Al-C alloys using modified Burke– Turnbull equation and postmortem TEM, yielding a linear growth velocity
    of ~1 μm/s [20], which is much larger than what we observed by in situ TEM. Yanar et al. determined the growth
    rate by dividing the growth distance by the estimated time of growth, while the growth distance was calculated
    by averaging maximum size measured in five τ colonies [20]. We speculate that one τ colony in the postmortem
    TEM sample might contain several or more τ grains grown from different nuclei at the same time, thus the growth
    distance might be overestimated. In fact, our in situ TEM studies showed that there are many τ grains grown
    from many different τ nuclei distributed in the sample. If several τ grains from different nuclei met together
    and grew into one τ colony, it is difficult to distinguish them by postmortem TEM observations. By applying
    the modified Burke–Turnbull equation and the average growth rate observed by our in situ TEM, the activation
    energy for diffusional growth in MnAlC is estimated to be 182.5 kJ/mol, which falls in the range of that reported
    by Lu et.al but is higher than that estimated by Yanar et al. [20,21].
  note: Yanar value is from Yanar et al. 2002 (doi 10.1007/s11661-002-0363-3) as quoted by Si et al.
