- id: mnal_formation_path_sologubenko2004b
  phase: tau-MnAl-C
  quantity: formation_path
  value: 'displacive (plate-like) mode is stepwise: epsilon -> epsilon-prime (B19, three variants) -> stacking faults
    -> polytypes -> twinned tau plates; lattice correspondence transmitted through all steps; each step requires
    nucleation at epsilon-prime domain boundaries'
  unit: null
  conditions: Mn-39.2 at.% Al-0.8 at.% C Bridgman epsilon single crystal, quenched from 1373 K, annealed 673 K 5
    h, TEM
  source:
    doi: 10.1515/ijmr-2004-0097
    title: On the plate-like τ-phase formation in MnAl–C alloys
    first_author: Sologubenko, Alla S.
    year: 2004
    url: https://api.crossref.org/works/10.1515/ijmr-2004-0097
    evidence: full_text
    locator: abstract
  quote: A detailed description of the displacive transformation mode of the formation of plate-like τ-phase in
    MnAl (containing a small amount of carbon) is given. The plate-like τ-phase forms in a stepwise mode from the
    ɛ-phase. Crystallographic correspondence is transmitted from the ɛ- to the τ-phase during the whole transformation
    sequence. The intermediate long-range ordered ɛ′-phase nucleates within the ɛ-matrix. As ɛ′-domains evolve,
    elastic strains increase at the ɛ′-interfaces until shear occurs in ɛ′-domains to reduce the transformation
    strains. Stacking faults appear between ɛ′-domain boundaries. Polytypes are the result of a shuffling of the
    stacking faults within ɛ′-domains. Finally, the ɛ′-domain boundaries are overcome by the collective motion of
    transformation dislocations which form twinned τ-plates. The ɛ′-domain boundaries are nucleation sites for successive
    transformation steps and limit the spatial extension of the transformation for the intermediate steps.
  note: Quote from the Crossref abstract (clean Greek letters) of the paper read in full (ETH Research Collection
    copy).
