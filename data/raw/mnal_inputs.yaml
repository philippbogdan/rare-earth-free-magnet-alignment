    locator: Section 1, p. 2
  quote: In this study, τ-MnAl-C was hot deformed through the die upsetting process. This process is analogous to
    hot extrusion in that dynamic recrystallization and texture formation also occur. Die-upset MnAl–C magnets have
    a radial texture and therefore, ring magnets for motor applications could be prepared through this method [29].
  note: 'Same paper (Section 3.1): ''The maximum degree of texture which can be achieved by die-upsetting is necessarily
    lower than that achievable via extrusion because in die-upset samples as the preferred alignment occurs in the
    plane perpendicular to the axis of the applied force rather than in the direction parallel to it, as is the
    case for extrusion.'' Measured remanences are in the sealed outcome file.'
