# mnal inputs: tau-MnAl and tau-MnAl-C (L1_0) formed from hcp epsilon. Records per data/SCHEMA.md.
# Phase names: tau-MnAl, tau-MnAl-C, tau-MnAl(C) (both), epsilon-MnAl(-C) parent, epsilon'-MnAl-C (orthorhombic B19 intermediate).
# Every quote is verbatim from the source text fetched (whitespace normalised; PDF ligature/hyphenation fixes; '...' joins non-adjacent fragments).
# Patents have doi: null. Values converted to schema units carry 'converted from' in note.
- id: mnal_growth_direction_pacheco2023
  phase: epsilon-MnAl-C
  quantity: growth_direction
  value: <001> (c-axis) of hcp epsilon parallel to the build direction in L-PBF
  unit: ''
  uncertainty: null
  conditions: L-PBF (EOS M100), (Mn60.7Al39.3)100C2.8 at.% gas-atomised powder, 18-25 W, 160-240 mm/s, as-printed
  source:
