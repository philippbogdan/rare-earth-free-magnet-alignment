  source:
    doi: 10.3390/alloys2020007
    title: Additive Manufacturing of MnAl(C)-Magnets
    first_author: Pacheco, Victor
    year: 2023
    url: https://mdpi-res.com/d_attachment/alloys/alloys-02-00007/article_deploy/alloys-02-00007.pdf
    evidence: review
    locator: Section 3, p. 102-103
  quote: For instance, Kojima et al. [ 18] observed that during the annealing of anε-phase single crystal, the transformation
    sequence ε (hexagonal)→ ε’ (orthorhombic)→ τ (tetragonal) occurs, with the crystallographic relations (0001)ε
    || (100)ε’ || (111)τ. Similar relations were proposed by Jakubovics et al. [19]. These crystallographic relations
    were proposed for the τ-phase with unit cell parameters around a = 3.9 Å and c = 3.6 Å [18] (theτ-phase can
    be described with 2 different tetragonal unit cells). In the present work, we used the unit cell with parameters
    around a = 2.8 Å and c = 3.6 Å [21]. The (111)τ planes in the first reference system were equivalent to the
    (101)τ in the latter.
  note: 'Review-level (Pacheco quoting Kojima 1975). Gives both tau cell settings: fct a = 3.9, c = 3.6 A and primitive
    a = 2.8, c = 3.6 A, with (111)fct = (101)primitive. The pypdf text layer runs words together (''theε-phase'');
    quote as printed.'
