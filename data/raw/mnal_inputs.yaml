    orientation relationships: (0001)ε ∥ (100)ε′ ∥ (111)τ and ([1̄100]ε ∥ [001]ε′ ∥ [1̄1̄2]τ. The ε′‐phase is new
    and has a B19‐type structure. The ε→ε′ transformation is a disorder‐order transformation and the ε′→τ is martensitic.'
  note: Abstract only. Single-variant (single-crystal) tau under stress is a stress_effect_on_formation item.
