    url: https://api.crossref.org/works/10.1063/1.364619
    evidence: abstract
    locator: abstract
  quote: For many years the conventional wisdom has been that the τ phase forms via a displacive or martensitic
    transformation. In this paper the results of a new electron microscopy investigation into the nature of the
    ε→τ transformation and microstructural development are reported. It is shown that over the temperature range
    450–700 °C the transformation involves a compositionally invariant, diffusional nucleation and growth process
    rather than a shear mechanism. Importantly, elucidating the mechanism of the phase transformation has important
    practical implications since a diffusional mechanism involving the migration of incoherent or partially coherent
    interfaces points to very different thermomechanical processing routes and alloying strategies.
  note: Abstract only (J. Appl. Phys. 81, 5624). The full Scripta Mater. 36 (1997) 151 paper by the same group (see
    mnal_formation_path_hoydick1997b) is closed.
