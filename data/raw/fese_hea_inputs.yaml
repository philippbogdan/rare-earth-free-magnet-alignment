- id: fese_formation_solvo_saucedo2021
  phase: Fe3Se4 (monoclinic)
  quantity: formation_path
  value: solvothermal reaction of Fe3(CO)12 and Ph2Se2 in oleylamine/octadecene
  unit: text
  conditions: undoped x=0 included; 300 °C for 1 h
  source:
    doi: 10.1021/acs.jpcc.1c06841
    title: Increasing Magnetic Hardness of Fe 3 Se 4 via Cu Doping
    first_author: Luis A. Saucedo
    year: 2021
    url: https://par.nsf.gov/servlets/purl/10345242
    evidence: full_text
    locator: Materials and Methods, Method B
  quote: 'SynthesisMethod B. The samples of (Fe1−xCux)3Se4 (x

    = 0, 0.01, 0.03, 0.05, 0.07, 0.10, 0.15) were prepared by

    combining Fe3(CO)12 and Cu(acac)2 in the required

    stoichiometric ratio, for a total of 0.75 mmol of the metal

    ions, with 234 mg (0.75 mmol) of Ph2Se2 in a mixture of 8 mL

    of oleylamine and 2 mL of octadecene. The mixture was

    degassed under vacuum at 80 °C for 40 min, after which the

    reaction vessel was reﬁlled with Ar and heated to 300 °C at a

    rate of 5 °C/min. The reaction was allowed to progress for 1 h,

    followed by air-cooling.'
  note: Chemical synthesis rather than a coherent parent-to-product solid-state transformation. No OR or crystallographic
    variant count is established.
