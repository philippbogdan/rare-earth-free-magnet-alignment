  value: 'heating 628 K: LTP -> Mn1.08Bi + Bi-rich liquid; 719 K: Mn1.08Bi -> Mn + liquid; cooling 613 K: Mn1.08Bi -> LTP + Mn; 535 K eutectic'
  unit: K
  conditions: Mn-Bi phase diagram, review summary (ASM diagram, ref. [6])
  source:
    doi: 10.1063/10.0000360
    title: 'Low-temperature MnBi alloys: Electronic and magnetic properties, constitution, morphology and fabrication (Review article)'
    first_author: Antonov, V. N.
    year: 2020
    url: https://www.osti.gov/servlets/purl/1599882
    evidence: review
    locator: Sec. 2.1 Crystal structure
  quote: 'MnBi exhibits a first-order structural transition between temperatures of 613 K and 628 K [91]. The LTP possesses the desired magnetic properties. Researchers also refer to this phase as α -MnBi. The Mn–Bi phase diagram is shown in Fig. 1 [6]. Key phase transformations are: 1) at 628 K upon heating, α -MnBi → Mn1.08Bi + Birich liquid; 2) at 719 K upon heating Mn1.08Bi → Mn + Bi-rich liquid; 3) at 613 K during cooling Mn1.08Bi → α -MnBi + Mn; 4) at 535 K during cooling, MnBi + Bi → Bi-rich liquid.'
  note: Item 4 is written as in the source (the eutectic reaction L <-> Bi + MnBi at 535 K). 'Birich' in item 1 is as in the PDF text layer (printed 'Bi-rich' across a line break).
