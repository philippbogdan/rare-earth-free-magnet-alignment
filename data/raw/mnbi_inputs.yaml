    year: 2003
    url: https://www.jstage.jst.go.jp/article/matertrans/44/10/44_10_2207/_pdf
    evidence: full_text
    locator: Abstract
  quote: During the conventional peritectic solidification, the BiMn grains produced through the peritectic reaction did not align because of difficulties of the grain rotation. Rapid solidification produced the finely distributed BiMn grains in the Bi-rich matrix or the Bi-BiMn eutectic structure at offeutectic compositions. Heating the rapidly solidified structure resulted in the semi-solid state even for Bi-50 at%Mn alloy, in which no semi-solid state containing BiMn phase in equilibrium. The BiMn grains suspended in the semi-solid state rotated in the favorable direction. Growth of the BiMn grains following the rotation achieved c-axes alignment of the BiMn grains.
