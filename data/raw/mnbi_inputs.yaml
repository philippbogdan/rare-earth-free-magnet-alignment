- id: mnbi_tc_mcguire2014
  phase: LTP-MnBi
  quantity: Tc
  value: 680
  unit: K
  conditions: single crystal; hypothetical Curie temperature from a fit of M(T) up to the decomposition at 630 K
  source:
    doi: 10.1103/PhysRevB.90.174425
    title: Symmetry-lowering lattice distortion at the spin reorientation in MnBi single crystals
    first_author: McGuire, Michael A.
    year: 2014
    url: https://arxiv.org/pdf/1411.2448
    evidence: full_text
    locator: Sec. III, Fig. 4a
  quote: Upon heating above room temperature (Fig. 4a), the magnetization decreases and then abruptly drops by orders of magnitude near Tdec = 630 K, signaling the decomposition of MnBi. A simple model [34] is used to fit the temperature dependence up to Tdec , giving an estimate of the hypothetical Curie temperature of 680 K.
  note: Extrapolated (virtual) Tc; the ferromagnetic LTP never reaches it because it decomposes at ~630 K.
