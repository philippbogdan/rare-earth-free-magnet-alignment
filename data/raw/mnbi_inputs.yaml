  quote: MnBi single crystals were grown by pulling with a seed from a bismuth-rich melt [6,123]. By varying the amount ... of excess Bi, the growth could be performed at a temperature in either the low-temperature phase region (below 355 °C) or high-temperature phase region of the compound. The effects of pulling rate and seed orientation on Bi inclusions in the grown crystals were investigated. It was established that at a pulling rate of 0.5 cm per day, Bi inclusions can be minimized by pulling with the crystallographic c-axis of the seed normal to the surface of the melt. By changing the growth temperature and Mn concentration in the melt, the effects of phase transformation on the degree of crystallinity and orientation of the crystals grown by this method were investigated.
