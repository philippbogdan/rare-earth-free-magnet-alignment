- id: mnbi_primcryst_mcguire2014b
  phase: LTP-MnBi
  quantity: primary_crystallisation
  value: MnBi grows from melts with excess Bi; cooling in a field gives coaligned MnBi crystallites in Bi
  unit: ''
  conditions: literature summary (refs [5], [17], [19])
  source:
    doi: 10.1103/PhysRevB.90.174425
    title: Symmetry-lowering lattice distortion at the spin reorientation in MnBi single crystals
    first_author: McGuire, Michael A.
    year: 2014
    url: https://arxiv.org/pdf/1411.2448
    evidence: review
    locator: Sec. I
  quote: Synthesis of high quality single phase samples and in particular large single crystals of MnBi is complicated by the peritectic nature of this reaction, the relatively low temperature at which it occurs (630 K), and the nearness to the eutectic temperature (535 K). MnBi can be grown from a melt with excess Bi, as first described by Adams et al. [5] By cooling the melt in a magnetic field, textured composites with coaligned MnBi crystallites embedded in a Bi matrix have been obtained and studied [17, 19].
  note: ''
- id: mnbi_fieldeffect_mcguire2014
  phase: LTP-MnBi
  quantity: field_effect_on_formation
  value: 'a strong field stabilizes ferromagnetic MnBi against peritectic decomposition: up to ~650 K in 10 T'
  unit: K
  conditions: literature summary (refs [17, 18])
  source:
    doi: 10.1103/PhysRevB.90.174425
    title: Symmetry-lowering lattice distortion at the spin reorientation in MnBi single crystals
    first_author: McGuire, Michael A.
    year: 2014
    url: https://arxiv.org/pdf/1411.2448
    evidence: review
    locator: Sec. I
  quote: Since MnBi is ferromagnetic and the decomposition products are paramagnetic (at the peritectic temperature), application of strong magnetic field has been shown to stabilize MnBi to higher temperatures, up to about 650 K in a 10 Tesla magnetic field [17, 18].
  note: Zeeman energy of the ferromagnetic LTP vs paramagnetic HTP + liquid shifts the peritectic upward (~20 K in 10 T relative to ~630 K).
