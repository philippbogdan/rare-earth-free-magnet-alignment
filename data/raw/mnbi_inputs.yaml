  quote: Solidification experiments of Bi3--6wt%Mn alloys under a high magnetic field up to 10 T have been carried out. It is found that the primary BiMn grains in the BiMn alloy rotate and align along the direction of the magnetic field. There are 3 kinds of structures of the BiMn phase according to the starting solidification zone. In the zone below the Curie point rodlike BiMn grains appear, in the zone above the Curie point and below the liquidus flakelike BiMn grains appear, and in the case above the liquidus temperature tightly piled flakelike BiMn grains are produced. In all these cases, the grains are aligned and orientated at <001> along the direction of the field. When the alloy with aligned rod like BiMn grains is reheated to below the Curie point, the alignment of BiMn is kept; and when reheated to above the Curie point, the alignment breaks down.
  note: 'Soft hyphens in the web text (Bi-3, Bi-Mn, rod-like, flake-like) are dropped in the normalised quote. ''Curie point'' here = the LTP->HTP transition (~628 K). Crossref lists no authors; authors from the journal page: Z. Ren, X. Li, K. Deng, H. Wang, Y. Zhong (Shanghai Univ.). Implies (i) HTP crystals forming above ~628 K in 10 T also align with <001> || field (paramagnetic, susceptibility anisotropy) and (ii) after HTP->LTP on cooling the c-axis alignment is retained when the field is on; reheating above the transition without (or with?) field destroys it.'
