  quote: The peritectic reaction between Mn and Bi dictates that regardless of the starting stock composition, the conventional casting process will always result in Mn precipitating out from the MnBi liquid. The diffusion of Mn or Bi to MnBi is slow, which indicates that low-temperature sintering will cost a long time to complete, and it is likely the reaction is only partly complete, leaving behind Mn and Bi as impurities. Historically, the alloy was obtained by sintering Mn and Bi powders at high temperatures. Such a process will yield 60% pure MnBi phases.
