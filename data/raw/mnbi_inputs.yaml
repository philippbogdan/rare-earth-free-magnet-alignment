# Topic: mnbi -- low-temperature phase (LTP) MnBi: NiAs-type hexagonal (P63/mmc), easy axis c at room temperature.
# INPUT records (visible) per data/SCHEMA.md. Every value carries a verbatim quote from the fetched source
# (text layer of the PDF/HTML/API record named in source.url; glyphs lost in text layers are explained in note).
# Derived values (unit conversions, Js from Ms, X-ray density from lattice, figure readings) are flagged in note.
# Phase names used in this file:
#   LTP-MnBi      low-temperature phase MnBi (alpha-MnBi), the hard magnetic phase
#   HTP-Mn1.08Bi  high-temperature phase (beta, ~Mn1.08Bi), stable between ~628-632 K and ~719-721 K, paramagnetic
#   QHTP-MnBi     quenched (retained) high-temperature phase / HTP-like metastable phases (ferro/ferrimagnetic at low T)
#   Bi, liquid    bismuth matrix and Bi-rich melt
# Collected 2026-10-03 for the magnet-align-frontier project (literature agent, topic mnbi).

