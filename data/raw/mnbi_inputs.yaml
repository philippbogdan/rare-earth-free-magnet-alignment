    url: https://www.osti.gov/servlets/purl/1599882
    evidence: review
    locator: Sec. 6.1
  quote: The Mn–Bi phase diagram shows that in addition to the peritectic reaction, there is a eutectic reaction at 535 K (262 °C), L ↔ Bi + MnBi . This reaction limits the maximum temperature to which the material can be exposed. While this eutectic temperature is about 62 K higher than the desired operating temperature of 473 K (200 °C), it is rather low for a typical bulk magnet fabrication method such as sintering and hot pressing. In practice, the feedstock powder always contains several percent of Bi metal as the result of the peritectic reaction. Once the fabrication temperature exceeds the eutectic temperature at 535 K, Bi and part of the MnBi will transform to Bi rich liquid. Any trace amounts of oxygen may react with the Mn atoms in the liquid resulting in MnO formation.
  note: 'Consolidation window for LTP powder: below ~535 K if free Bi is present (liquid-phase/oxidation risk above), absolute upper limit ~628 K (LTP -> HTP + L).'
