  quote: The NMR results from powders [25] and magnetization measurements on single crystals [12] show the rotation away from the c-axis upon cooling begins near 140 K, increases gradually upon further cooing to TSR = 90 K, and then abruptly completes, with the moment flopping discontinuously into the ab-plane.
